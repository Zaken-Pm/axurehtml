<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AML Monitoring 后台原型</title>
</head>
<body>

<style>
/* ==========================================================================
   AML Monitoring · 后台原型（v1.0，依《AML_需求盘点与待确认_v1.6》决议）
   版面：沿用测试站后台——左侧选单＋顶部资讯列＋白底内容卡片；字级最小 12px
   ========================================================================== */

/* === Design Tokens === */
:root{
  --c-page:#e9eef6; --c-bg:#ffffff; --c-surface:#f5f7fa; --c-sidebar:#eef2f8; --c-sidebar-active:#dce6f6;
  --c-text:#303133; --c-text-2:#4f545c; --c-text-3:#6b7079;
  --c-border:#dcdfe6; --c-border-2:#ebeef5;
  --c-primary:#1f6fd6; --c-primary-hover:#185bb3; --c-primary-soft:#e8f1fd;
  --c-danger:#c62f2a; --c-danger-soft:#fdeceb; --c-warn:#9a5b00; --c-warn-soft:#fff4e0;
  --c-ok:#1d7a3a; --c-ok-soft:#e7f5ec; --c-muted:#eef0f3; --c-neutral:#4a5a9c; --c-neutral-soft:#eef1f9; --c-off:#6b7079;
  --c-new:#c4127a; --c-new-soft:#fbe9f3; --c-chg:#9a5b00;
  --c-switch-off:#c4c9d2; --c-overlay:rgba(20,24,33,.45);
  --c-chart-1:#1f6fd6; --c-chart-2:#e3a008; --c-chart-3:#c62f2a; --c-chart-4:#1d7a3a; --c-chart-5:#7c5cc4; --c-chart-6:#2aa3b8;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --radius-s:4px; --radius:6px; --radius-l:8px;
  --shadow-pop:0 12px 32px rgba(20,24,33,.18);
  --font-ui:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --fs-min:.75rem;   /* 12px：本原型最小字级 */
  --fs-s:.8125rem;   /* 13px */
  --fs-m:.875rem;    /* 14px */
  --fs-l:1rem;
  --fs-xl:1.25rem;
  --sidebar-w:232px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --c-page:#13161c; --c-bg:#1b1f27; --c-surface:#222731; --c-sidebar:#1b1f28; --c-sidebar-active:#263252;
  --c-text:#e6e8ec; --c-text-2:#c3c7cf; --c-text-3:#a2a8b3; --c-border:#363c49; --c-border-2:#2c313c;
  --c-primary:#6aa6f5; --c-primary-hover:#8bbaf7; --c-primary-soft:#1e2c45;
  --c-danger:#f07a74; --c-danger-soft:#3a2121; --c-warn:#f0b35a; --c-warn-soft:#3a2d17; --c-ok:#6fcf8d; --c-ok-soft:#1a3324; --c-muted:#2a2f39; --c-neutral:#a9b6ec; --c-neutral-soft:#262d45; --c-off:#a2a8b3;
  --c-new:#f06bb5; --c-new-soft:#3a1f2f; --c-chg:#f0b35a; --c-switch-off:#4a5160; --c-overlay:rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --c-page:#13161c; --c-bg:#1b1f27; --c-surface:#222731; --c-sidebar:#1b1f28; --c-sidebar-active:#263252;
  --c-text:#e6e8ec; --c-text-2:#c3c7cf; --c-text-3:#a2a8b3; --c-border:#363c49; --c-border-2:#2c313c;
  --c-primary:#6aa6f5; --c-primary-hover:#8bbaf7; --c-primary-soft:#1e2c45;
  --c-danger:#f07a74; --c-danger-soft:#3a2121; --c-warn:#f0b35a; --c-warn-soft:#3a2d17; --c-ok:#6fcf8d; --c-ok-soft:#1a3324; --c-muted:#2a2f39; --c-neutral:#a9b6ec; --c-neutral-soft:#262d45; --c-off:#a2a8b3;
  --c-new:#f06bb5; --c-new-soft:#3a1f2f; --c-chg:#f0b35a; --c-switch-off:#4a5160; --c-overlay:rgba(0,0,0,.6); color-scheme:dark; }

/* === Base === */
[hidden]{display:none!important;}
html{font-size:16px;}
body{background:var(--c-page);color:var(--c-text);font-family:var(--font-ui);font-size:var(--fs-m);line-height:1.5;}
h1,h2,h3,h4{margin:0;line-height:1.3;}
p{margin:0;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.num{font-variant-numeric:tabular-nums;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.muted{color:var(--c-text-3);}

/* === App layout === */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh;}
.main-col{min-width:0;display:flex;flex-direction:column;}
@media (max-width:1023px){ .app{grid-template-columns:minmax(0,1fr);} }

/* === Sidebar === */
.sidebar{background:var(--c-sidebar);border-right:1px solid var(--c-border-2);padding-block:var(--space-3);padding-left:max(0px, env(safe-area-inset-left,0px));overflow-y:auto;}
.nav,.nav ul{list-style:none;margin:0;padding:0;}
.nav__group{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px var(--space-4);border:0;background:none;text-align:left;font-weight:700;color:var(--c-text);cursor:pointer;}
.nav__group:hover{background:var(--c-sidebar-active);}
.nav__group[aria-expanded="true"]{color:var(--c-primary);background:var(--c-sidebar-active);}
.nav__link{display:flex;align-items:center;gap:var(--space-2);width:100%;padding:7px var(--space-4) 7px 36px;border:0;background:none;text-align:left;color:var(--c-text-2);font-size:var(--fs-s);cursor:pointer;}
.nav__link::before{content:"▸";font-size:var(--fs-min);color:var(--c-text-3);}
.nav__link:hover{color:var(--c-primary);}
.nav__link--parent{font-weight:700;color:var(--c-text);}
.nav__link--parent::before{content:"▾";}
.nav__link--parent[aria-expanded="false"]::before{content:"▸";}
.nav__sub .nav__link{padding-left:54px;}
.nav__link--active{color:var(--c-primary)!important;background:var(--c-sidebar-active);box-shadow:inset 3px 0 0 var(--c-primary);font-weight:700;}
.badge-new,.badge-chg{font-size:var(--fs-min);font-weight:700;border-radius:var(--radius-s);padding:0 4px;line-height:1.4;border:1px solid currentColor;}
.badge-new{color:var(--c-new);}
.badge-chg{color:var(--c-chg);}
@media (max-width:1023px){ .sidebar{border-right:0;border-bottom:1px solid var(--c-border-2);max-height:260px;} }

/* === Topbar === */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3);padding-block:var(--space-3);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));background:var(--c-bg);border-bottom:1px solid var(--c-border-2);}
.topbar__left{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4);}
.topbar__stats{display:flex;flex-wrap:wrap;gap:var(--space-3);background:var(--c-primary-soft);border-radius:999px;padding:4px 14px;font-size:var(--fs-min);color:var(--c-text-2);}
.topbar__stats b{color:var(--c-primary);}
.topbar__right{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);min-width:0;}
.demo{flex-wrap:wrap;}
.demo{display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-min);color:var(--c-text-2);background:var(--c-warn-soft);border:1px dashed var(--c-warn);border-radius:var(--radius);padding:3px 8px;}
.lang{display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-s);color:var(--c-text-2);}
.lang select{border:1px solid var(--c-border);border-radius:var(--radius-s);background:var(--c-bg);padding:3px 8px;font-size:var(--fs-s);}
.demo select{border:1px solid var(--c-border);border-radius:var(--radius-s);background:var(--c-bg);padding:2px 6px;font-size:var(--fs-min);}
.bell{position:relative;border:0;background:none;font-size:1.2rem;cursor:pointer;padding:4px 6px;color:var(--c-text-2);}
.bell__count{position:absolute;top:-2px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--c-danger);color:#fff;font-size:var(--fs-min);line-height:18px;text-align:center;padding:0 4px;font-weight:700;}
.bell-pop{position:absolute;right:max(16px, env(safe-area-inset-right,0px));top:56px;width:min(380px,92vw);background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius-l);box-shadow:var(--shadow-pop);z-index:60;}
.bell-pop__head{display:flex;justify-content:space-between;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--c-border-2);font-weight:700;}
.bell-pop ul{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto;}
.bell-pop li button{display:block;width:100%;text-align:left;border:0;background:none;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--c-border-2);cursor:pointer;}
.bell-pop li button:hover{background:var(--c-surface);}
.bell-pop li .t{font-weight:700;color:var(--c-danger);}
.bell-pop li .d{font-size:var(--fs-min);color:var(--c-text-3);}
.bell-pop li.read .t{color:var(--c-text-2);font-weight:400;}

/* === Content === */
.content{padding-block:var(--space-4) var(--space-6);padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));min-width:0;}
.panel{background:var(--c-bg);border-radius:var(--radius-l);padding:var(--space-4) var(--space-5) var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);min-width:0;}
.breadcrumb{display:flex;flex-wrap:wrap;gap:var(--space-2);color:var(--c-text-2);font-size:var(--fs-s);}
.breadcrumb ol{display:flex;flex-wrap:wrap;gap:var(--space-2);list-style:none;margin:0;padding:0;}
.breadcrumb li + li::before{content:"›";margin-right:var(--space-2);color:var(--c-text-3);}
.page-title{font-size:var(--fs-xl);}
.page-desc{color:var(--c-text-2);font-size:var(--fs-s);max-width:80ch;}
.note{font-size:var(--fs-min);color:var(--c-text-3);}
.noperm{padding:var(--space-6);text-align:center;color:var(--c-text-2);border:1px dashed var(--c-border);border-radius:var(--radius-l);}

/* === Filters === */
.filters{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-3);align-items:center;}
.input,.select,.textarea{border:1px solid var(--c-border);border-radius:var(--radius-s);background:var(--c-bg);padding:5px 10px;min-height:32px;font-size:var(--fs-s);}
.input:hover,.select:hover,.textarea:hover{border-color:var(--c-text-3);}
.input:focus,.select:focus,.textarea:focus{border-color:var(--c-primary);}
.input--error,.textarea--error{border-color:var(--c-danger)!important;}
.input--w{width:200px;max-width:100%;}
.date-range{display:inline-flex;align-items:center;gap:6px;}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:var(--fs-s);}
.check input{accent-color:var(--c-primary);width:15px;height:15px;}
.field{display:flex;flex-direction:column;gap:var(--space-1);min-width:0;}
.field__label{font-size:var(--fs-s);color:var(--c-text-2);font-weight:700;}
.field__label .req{color:var(--c-danger);margin-right:2px;}
.field__error{color:var(--c-danger);font-size:var(--fs-min);min-height:1.2em;}
.field__help{color:var(--c-text-3);font-size:var(--fs-min);}

/* === Buttons === */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 14px;border-radius:var(--radius-s);border:1px solid var(--c-border);background:var(--c-bg);color:var(--c-text);cursor:pointer;font-size:var(--fs-s);white-space:nowrap;}
.btn:hover{border-color:var(--c-primary);color:var(--c-primary);}
.btn:active{transform:translateY(1px);}
.btn--primary{background:var(--c-primary);border-color:var(--c-primary);color:#fff;}
.btn--primary:hover{background:var(--c-primary-hover);border-color:var(--c-primary-hover);color:#fff;}
.btn--danger{background:var(--c-danger);border-color:var(--c-danger);color:#fff;}
.btn--danger:hover{filter:brightness(.92);color:#fff;}
.btn--link{border:0;background:none;padding:0 2px;color:var(--c-primary);}
.btn--link:hover{text-decoration:underline;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
:root[data-theme="dark"] .btn--primary,:root[data-theme="dark"] .btn--danger{color:#10131a;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn--primary,:root:not([data-theme="light"]) .btn--danger{color:#10131a;} }

/* === Stat cards & charts === */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3);}
.stat{border:1px solid var(--c-border-2);border-radius:var(--radius-l);padding:var(--space-3) var(--space-4);background:var(--c-surface);}
.stat__label{font-size:var(--fs-min);color:var(--c-text-3);}
.stat__value{font-size:1.375rem;font-weight:700;font-variant-numeric:tabular-nums;}
.stat__sub{font-size:var(--fs-min);color:var(--c-text-3);}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-3);}
.chart{display:flex;align-items:center;gap:var(--space-4);border:1px solid var(--c-border-2);border-radius:var(--radius-l);padding:var(--space-3) var(--space-4);}
.donut{width:96px;height:96px;border-radius:50%;flex:none;position:relative;}
.donut::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--c-bg);}
.legend{list-style:none;margin:0;padding:0;font-size:var(--fs-min);display:flex;flex-direction:column;gap:4px;}
.legend li{display:flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:2px;flex:none;}
.chart__title{font-size:var(--fs-s);font-weight:700;margin-bottom:4px;}

/* === Table === */
.table-wrap{overflow-x:auto;border:1px solid var(--c-border-2);border-radius:var(--radius-s);}
.table{width:100%;border-collapse:collapse;min-width:960px;font-size:var(--fs-s);}
.table th,.table td{padding:10px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--c-border-2);}
.table thead th{background:var(--c-surface);color:var(--c-text-2);font-weight:700;white-space:nowrap;}
.table tbody tr:hover td{background:color-mix(in srgb, var(--c-primary-soft) 45%, transparent);}
.table .c{text-align:center;}
.member{display:flex;flex-direction:column;gap:2px;font-size:var(--fs-min);color:var(--c-text-2);}
.member b{color:var(--c-text);font-size:var(--fs-s);}
.empty{padding:var(--space-6);text-align:center;color:var(--c-text-3);}
.pager{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:var(--space-3);color:var(--c-text-2);font-size:var(--fs-s);}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);background:var(--c-primary-soft);border-radius:var(--radius-s);font-size:var(--fs-s);}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--c-muted);font-size:1.1rem;}
.list-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-2);}
.list-head__title{font-size:var(--fs-m);font-weight:700;}
.list-head__right{display:flex;align-items:center;gap:var(--space-3);}
.th-sort{border:0;background:none;padding:0;font:inherit;font-weight:700;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.th-sort:hover{color:var(--c-primary);}
.th-sort__icon{font-size:var(--fs-min);color:var(--c-text-3);}
th[aria-sort="ascending"] .th-sort__icon,th[aria-sort="descending"] .th-sort__icon{color:var(--c-primary);}
.table tfoot td{font-weight:700;background:var(--c-surface);border-top:1px solid var(--c-border);}
.threshold{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--c-danger-soft);color:var(--c-danger);font-size:var(--fs-min);font-weight:700;padding:4px 12px;border-radius:999px;}
.tag-filter{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;}
.chip--x{display:inline-flex;align-items:center;gap:4px;background:var(--c-primary-soft);color:var(--c-primary);}
.chip--x button{border:0;background:none;padding:0 2px;color:inherit;cursor:pointer;font-size:var(--fs-min);line-height:1;}
.ops{display:flex;flex-wrap:wrap;gap:4px 10px;}
.bulk__count{font-weight:700;margin-right:auto;}

/* === Pills / tags === */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-min);font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.pill--high{background:var(--c-danger-soft);color:var(--c-danger);}
.pill--mid{background:var(--c-warn-soft);color:var(--c-warn);}
.pill--low{background:var(--c-ok-soft);color:var(--c-ok);}
.pill--muted{background:var(--c-muted);color:var(--c-text-2);}
.pill--off{background:var(--c-muted);color:var(--c-off);}
.pill--neutral{background:var(--c-neutral-soft);color:var(--c-neutral);}
.pill--info{background:var(--c-primary-soft);color:var(--c-primary);}
.chip{display:inline-block;font-size:var(--fs-min);padding:1px 8px;border-radius:999px;background:var(--c-muted);color:var(--c-text-2);margin:1px 2px 1px 0;}
.chip--warn{background:var(--c-warn-soft);color:var(--c-warn);}

/* === Tabs === */
.tabs{display:flex;gap:var(--space-5);border-bottom:1px solid var(--c-border);}
.tabs button{border:0;background:none;padding:var(--space-2) 2px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--c-text-2);font-weight:700;cursor:pointer;}
.tabs button[aria-selected="true"]{color:var(--c-primary);border-bottom-color:var(--c-primary);}

/* === 风控配置式版面（AML配置） === */
.cfg-title{font-size:var(--fs-l);font-weight:700;}
.cfg-card{border:1px solid var(--c-border-2);border-radius:var(--radius-s);}
.cfg-card__head{padding:var(--space-3);border-bottom:1px solid var(--c-border-2);color:var(--c-primary);font-size:var(--fs-m);font-weight:400;}
.cfg-card__note{padding:var(--space-2) var(--space-3);font-size:var(--fs-min);color:var(--c-text-3);background:var(--c-surface);border-bottom:1px solid var(--c-border-2);}
.cfg-row{display:grid;grid-template-columns:220px minmax(0,1fr) auto 96px;gap:var(--space-3) var(--space-4);align-items:start;padding:var(--space-3);border-bottom:1px solid var(--c-border-2);}
.cfg-row:last-child{border-bottom:0;}
.cfg-row--switch{grid-template-columns:minmax(0,1fr) 96px;}
.cfg-row--noswitch{grid-template-columns:220px minmax(0,1fr) auto;}
.cfg-row__label{padding-top:6px;}
.cfg-row__fields{display:flex;flex-direction:column;gap:var(--space-2);min-width:0;}
.cfg-row__inline{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);}
.cfg-row__inline .input{width:110px;}
.cfg-row__switch{display:flex;justify-content:flex-end;padding-top:4px;}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px var(--space-3);}
@media (max-width:767px){ .cfg-row,.cfg-row--switch,.cfg-row--noswitch{grid-template-columns:minmax(0,1fr) auto;} .cfg-row__label,.cfg-row__fields{grid-column:1 / -1;} }
.switch{display:inline-flex;align-items:center;gap:var(--space-2);border:0;background:none;padding:0;cursor:pointer;color:var(--c-text);font-size:var(--fs-s);}
.switch__track{position:relative;width:34px;height:18px;border-radius:999px;background:var(--c-switch-off);transition:background .15s;flex:none;}
.switch__track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;}
.switch[aria-checked="true"] .switch__track{background:var(--c-primary);}
.switch[aria-checked="true"] .switch__track::after{transform:translateX(16px);}
.switch[aria-checked="true"] .switch__text{color:var(--c-primary);}
.tag-select{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--c-border);border-radius:var(--radius-s);padding:4px 8px;min-height:32px;background:var(--c-bg);cursor:pointer;}

/* === Permission tree === */
.tree{list-style:none;margin:0;padding:0;font-size:var(--fs-s);}
.tree ul{list-style:none;margin:0;padding-left:22px;}
.tree__row{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:var(--radius-s);}
.tree__row--new{background:var(--c-new-soft);}
.tree__toggle{width:20px;height:20px;border:0;background:none;color:var(--c-text-3);cursor:pointer;padding:0;flex:none;font-size:var(--fs-min);}
.tree__toggle[aria-expanded="true"]{transform:rotate(90deg);}

function sortBy(th){
  const table=th.closest('table'), idx=[...th.parentNode.children].indexOf(th), tb=table.tBodies[0];
  const dir=th.getAttribute('aria-sort')==='ascending'?'descending':'ascending';
  $$('th[aria-sort]',table).forEach(h=>{ h.setAttribute('aria-sort','none'); h.querySelector('.th-sort__icon').textContent='⇅'; });
  th.setAttribute('aria-sort',dir); th.querySelector('.th-sort__icon').textContent=dir==='ascending'?'↑':'↓';
  const val=tr=>{ const td=tr.children[idx]; return td ? (td.dataset.v ?? td.textContent.trim()) : ''; };
  const isNum=v=>/^-?₱?[\d,]+(\.\d+)?$/.test(v), n=v=>parseFloat(String(v).replace(/[₱,]/g,''));
  const rows=[...tb.rows].filter(r=>!r.querySelector('.empty'));
  rows.sort((a,b)=>{ const x=val(a), y=val(b); const c=(isNum(x)&&isNum(y))?n(x)-n(y):x.localeCompare(y,'zh'); return dir==='ascending'?c:-c; });
  rows.forEach(r=>tb.append(r));
}

const I18N_LABELS = {'会员ID':'Member ID','会员 ID':'Member ID','账号':'Username','真实姓名':'Real Name','昵称':'Nickname','装置':'Device','投注站代码':'Betting Station Code','玩家账号':'Username',

const trSalary = v => v.replace(/^([\d,]+)以下\/月$/,'Below $1/month').replace(/^([\d,]+)以上\/月$/,'Above $1/month').replace(/\/月$/,'/month');
const trList = v => v.split('、').map(x=>tr(x)).join(', ');
const I18N_RULES = [
  [/^共 ([\d,]+) 笔$/, m=>`Total ${m[1]}`],
  [/^(\d+) 笔\/页$/, m=>`${m[1]}/page`],
  [/^选取 (.+)$/, m=>`Select ${m[1]}`],
  [/^移除 (.+)$/, m=>`Remove ${m[1]}`],
  [/^展开或收合 (.+)$/, m=>`Expand or collapse ${tr(m[1])}`],
  [/^(.+) 开启$/, m=>`${tr(m[1])}: on`],
  [/^已勾选 (\d+) 项$/, m=>`${m[1]} selected`],
  [/^(\d+) 岁$/, m=>`${m[1]} years old`],
  [/^风险详情 · (.+)$/, m=>`Risk Profile · ${m[1]}`],
  [/^告警详情 · (.+)$/, m=>`Alert Details · ${m[1]}`],
  [/^修改状态 · (.+)$/, m=>`Change Status · ${m[1]}`],
  [/^加标签（已选 (\d+) 位）$/, m=>`Add Tag (${m[1]} selected)`],
  [/^更新 EDD 状态（已选 (\d+) 位）$/, m=>`Update EDD Status (${m[1]} selected)`],
  [/^已为 (\d+) 位玩家加上标签$/, m=>`Tags added to ${m[1]} player(s)`],
  [/^确定将已选的 (\d+) 位玩家状态改为「(.+)」吗？$/, m=>`Change the status of ${m[1]} selected player(s) to "${tr(m[2])}"?`],
  [/^已将 (\d+) 位玩家改为「(.+)」$/, m=>`${m[1]} player(s) changed to "${tr(m[2])}"`],
  [/^已将 (\d+) 位玩家的 EDD 状态改为「(.+)」$/, m=>`EDD status of ${m[1]} player(s) changed to "${tr(m[2])}"`],
  [/^已导出所选 (\d+) 笔$/, m=>`Exported ${m[1]} selected row(s)`],
  [/^已寄出 (\d+) 封提醒$/, m=>`${m[1]} reminder(s) sent`],
  [/^信件预览（共 (\d+) 封，每位玩家一封）$/, m=>`Email preview (${m[1]} email(s), one per player)`],
  [/^\[AML\] 定期资料更新提醒－(.+?)( 等)?$/, m=>`[AML] Periodic KYC update reminder - ${m[1]}${m[2]?' and others':''}`],
  [/^前往「(.+)」，查询条件：账号＝(.+)（原型示意）$/, m=>`Go to "${tr(m[1])}" with filter Username = ${m[2]} (prototype only)`],

  [/^(.+)\/月$/, m=>trSalary(m[0])],

  [/^(.+)：无资料$/, m=>`${tr(m[1])}: no data`],
  [/^(.+)（会员ID (\d+)）$/, m=>`${m[1]} (Member ID ${m[2]})`],

  [/^比对字段（AML配置勾选）：(.+)；勾选字段全部相同才命中。$/, m=>`Fields compared (from AML Config): ${trList(m[1])}. Hit only when all selected fields match.`],
  [/^([^：]{1,30})：(.*)$/, m=> I18N_LABELS[m[1]] ? `${I18N_LABELS[m[1]]}: ${m[2] ? (/[一-鿿]/.test(m[2]) ? trList(m[2]) : m[2]) : ''}` : (I18N_EXACT[m[1]] && !m[2] ? `${I18N_EXACT[m[1]]}:` : null)],
];
function tr(str){
  if(!str || !/[一-鿿]/.test(str)) return str;
  if(str in I18N_EXACT) return I18N_EXACT[str];
  for(const [re,fn] of I18N_RULES){ const m=str.match(re); if(m){ const r=fn(m); if(r!=null) return r; } }
  return str;
}
let lang='zh';
const I18N_ATTRS=['placeholder','aria-label','title'];
function i18nNode(node){
  if(node.nodeType===3){
    const par=node.parentNode; if(!par || par.closest('script,style,[data-no-i18n]')) return;
    if(lang==='en'){
      const orig = node.__zh ?? node.textContent; const t=orig.trim(); if(!/[一-鿿]/.test(t)) return;
      if(par.tagName==='OPTION' && !par.hasAttribute('value')) par.setAttribute('value', par.textContent.trim());
      node.__zh = orig; const out = orig.replace(t, tr(t)); if(node.textContent!==out) node.textContent = out;
    } else if(node.__zh!=null){ node.textContent=node.__zh; node.__zh=null; }
    return;
  }
  if(node.nodeType!==1 || node.closest('script,style,[data-no-i18n]')) return;
  const els=[node,...node.querySelectorAll('*')];
  els.forEach(el=>{ if(el.closest('[data-no-i18n]')) return; I18N_ATTRS.forEach(a=>{ const key='zh_'+a.replace('-','_');
    if(lang==='en'){ const v=el.__i18n?.[key] ?? el.getAttribute(a); if(v && /[一-鿿]/.test(v)){ el.__i18n={...(el.__i18n||{}),[key]:v}; el.setAttribute(a,tr(v)); } }
    else if(el.__i18n?.[key]!=null){ el.setAttribute(a,el.__i18n[key]); delete el.__i18n[key]; } }); });
  const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT); let n; const list=[]; while(n=w.nextNode()) list.push(n); list.forEach(i18nNode);
}
function setLang(l){
  lang=l; document.documentElement.lang = l==='en'?'en':'zh-CN';
  try{ localStorage.setItem('amlProtoLang',l); }catch(e){}
  $('#langSel').value=l; i18nNode(document.body);
}
new MutationObserver(ms=>{ if(lang!=='en') return; ms.forEach(m=>m.addedNodes.forEach(i18nNode)); }).observe(document.body,{childList:true,subtree:true});
$('#langSel').addEventListener('change',e=>setLang(e.target.value));

render();
try{ if(localStorage.getItem('amlProtoLang')==='en') setLang('en'); }catch(e){}
