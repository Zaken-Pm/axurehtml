<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>赛事列表 · B版（篮球为主）</title>
<style>
:root{
  --bg:#eef1f7; --card:#ffffff; --ink:#182033; --mut:#8b93a6; --line:#eceff5;
  --orange:#f6631e; --orange2:#ff8a3d; --score:#f6631e;
  --navy:#141c30; --navy2:#1f2a48;
  --green:#12b866; --greenbg:#dff7ea; --red:#ef3b46; --redbg:#fde3e5; --live:#e5202f;
  --chip:#f3f6fb; --blue:#1ca9e0;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --radius:16px; --radius-s:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#c9ced8;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);font-size:16px}
.frame{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow:hidden}

/* ===== header ===== */
.hdr{position:sticky;top:0;z-index:30;padding:12px 14px 13px;
  background:radial-gradient(120% 130% at 85% -20%,rgba(246,99,30,.35),transparent 55%),linear-gradient(120deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff;display:flex;align-items:center;gap:10px}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--orange),var(--orange2))}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:7px;line-height:1}
.logo .ball{width:24px;height:24px;border-radius:50%;flex:0 0 auto;position:relative;
  background:radial-gradient(circle at 32% 28%,#ff9a52,#f6631e 70%);box-shadow:0 2px 6px rgba(246,99,30,.5)}
.logo .ball::before,.logo .ball::after{content:"";position:absolute;background:rgba(20,10,0,.55)}
.logo .ball::before{left:50%;top:2px;bottom:2px;width:1.6px;transform:translateX(-50%)}
.logo .ball::after{top:50%;left:2px;right:2px;height:1.6px;transform:translateY(-50%)}
.logo b{background:linear-gradient(180deg,#fff,#ffe6d3);-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr__sp{flex:1}
.bal{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:20px;padding:6px 11px;font-weight:800;font-size:13px}
.bal .coin{width:17px;height:17px;border-radius:50%;background:linear-gradient(180deg,#ffd76a,#f4a91d);color:#7a4f00;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.dep{background:linear-gradient(180deg,var(--orange2),var(--orange));color:#fff;border:none;border-radius:20px;padding:8px 15px;font-weight:900;font-size:13px;box-shadow:0 3px 10px rgba(246,99,30,.45);cursor:pointer}

/* ===== sport tabs ===== */
.sports{display:flex;gap:7px;overflow-x:auto;background:#fff;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:0;z-index:20}
.sports::-webkit-scrollbar{display:none}
.sptab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 14px;font-size:13px;font-weight:800;color:#6b7288;
  background:var(--chip);border:1px solid transparent;border-radius:22px;white-space:nowrap;cursor:pointer;transition:.15s}
.sptab .em{font-size:17px;line-height:1;filter:grayscale(.4);opacity:.8}
.sptab .cnt{font-size:11px;font-weight:800;color:#adb4c6}
.sptab:hover{background:#e9edf5}
.sptab.on{color:#fff;background:linear-gradient(135deg,var(--orange2),var(--orange));border-color:transparent;box-shadow:0 4px 12px rgba(246,99,30,.35)}
.sptab.on .em{filter:none;opacity:1}
.sptab.on .cnt{color:rgba(255,255,255,.85)}

/* ===== filter row ===== */
.filt{display:flex;align-items:center;gap:7px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:7px 13px;font-size:12.5px;font-weight:800;color:#59617a;cursor:pointer;transition:.15s}
.fchip:hover{border-color:#c9d3e2}
.fchip.on{background:linear-gradient(180deg,var(--orange2),var(--orange));color:#fff;border-color:transparent;box-shadow:0 2px 7px rgba(246,99,30,.28)}
.fchip.live.on{background:linear-gradient(180deg,#ff5d5d,#e5202f);box-shadow:0 2px 7px rgba(229,32,47,.32)}
.fchip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:5px;vertical-align:middle;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.seg{margin-left:auto;flex:0 0 auto;display:flex;background:#fff;border:1px solid #e3e8f0;border-radius:16px;overflow:hidden}
.seg button{border:none;background:transparent;padding:7px 12px;font-size:12px;font-weight:800;color:#8b93a6;cursor:pointer}
.seg button.on{background:linear-gradient(180deg,#43c1ff,var(--blue));color:#fff}

/* ===== featured strip (basketball) ===== */
.feat{margin:8px 10px 2px;border-radius:var(--radius);padding:12px 14px;position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(130% 120% at 90% 0%,rgba(246,99,30,.5),transparent 55%),linear-gradient(120deg,#1b2745,#0f1830)}
.feat__k{font-size:11px;font-weight:900;letter-spacing:1.5px;color:var(--orange2);text-transform:uppercase}
.feat__t{font-size:15px;font-weight:900;margin-top:2px}
.feat__d{font-size:12px;color:#b8c2d8;margin-top:3px;font-weight:600}
.feat__ball{position:absolute;right:-14px;top:-14px;width:78px;height:78px;border-radius:50%;opacity:.9;
  background:radial-gradient(circle at 34% 28%,#ff9a52,#f6631e 72%)}
.feat__ball::before,.feat__ball::after{content:"";position:absolute;background:rgba(20,10,0,.4)}
.feat__ball::before{left:50%;top:6px;bottom:6px;width:2px;transform:translateX(-50%)}
.feat__ball::after{top:50%;left:6px;right:6px;height:2px;transform:translateY(-50%)}

/* ===== league card ===== */
.wrap{padding:6px 10px 26px}
.lg{background:var(--card);border-radius:var(--radius);margin-bottom:12px;box-shadow:0 3px 14px rgba(30,45,80,.06);overflow:hidden}
.lg__h{display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer}
.lg__flag{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--chip);flex:0 0 auto}
.lg__nm{font-weight:900;font-size:14px}
.lg__sub{font-size:11px;color:var(--mut);font-weight:700;margin-top:1px}
.lg__star{margin-left:auto;color:#d7deea;font-size:18px;cursor:pointer;transition:.15s}
.lg__star.on{color:#ffb32b;transform:scale(1.08)}
.lg__chev{color:#b7c0d2;font-size:12px;transition:transform .2s}
.lg.collapsed .lg__chev{transform:rotate(180deg)}
.lg.collapsed .lg__body{display:none}
.lg__body{border-top:1px solid var(--line)}

/* ===== match (shared) ===== */
.mt{padding:11px 13px 12px;border-bottom:1px solid var(--line)}
.mt:last-child{border-bottom:none}
.mt__top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.liveic{flex:0 0 auto;display:inline-flex;width:19px;height:19px}
.liveic svg{width:19px;height:19px}
.liveic .arc{fill:none;stroke:var(--live);stroke-width:2;stroke-linecap:round}
.liveic .dot{fill:var(--live)}
.liveic .a1{animation:sig 1.5s infinite ease-in-out}
.liveic .a2{animation:sig 1.5s infinite ease-in-out .35s}
.liveic .dot{animation:sigdot 1.5s infinite ease-in-out}
@keyframes sig{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes sigdot{0%,100%{opacity:.6}50%{opacity:1}}
.tpill{background:#eef1f6;color:#5c6885;font-size:11px;font-weight:900;border-radius:7px;padding:3px 8px;white-space:nowrap}
.tpill.live{background:transparent;color:#5c6885;padding-left:0}
.mt__more{margin-left:auto;font-size:11px;font-weight:800;color:var(--blue);cursor:pointer;white-space:nowrap}
.mt__hdr{display:grid;grid-template-columns:1fr repeat(3,74px);gap:6px;align-items:end;margin-bottom:6px}
.mt__hcell{text-align:center;font-size:10.5px;font-weight:800;color:var(--mut);line-height:1.2}
.row{display:grid;grid-template-columns:1fr repeat(3,74px);gap:6px;align-items:center;margin-bottom:6px}
.row:last-child{margin-bottom:0}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team__lg{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:900}
.team__nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team__sc{margin-left:auto;font-size:16px;font-weight:900;color:var(--score);flex:0 0 auto;padding-left:6px;min-width:22px;text-align:right}

/* ===== basketball rich extras ===== */
.mt--bk{background:linear-gradient(180deg,#fff8f3,#ffffff 42%)}
.bkband{display:flex;align-items:center;gap:8px;margin:2px 0 10px;padding:8px 10px;border-radius:12px;background:linear-gradient(120deg,#fff1e7,#fff7f2);border:1px solid #ffe0cd}
.bkband .diff{font-size:11px;font-weight:900;color:var(--orange);background:#fff;border:1px solid #ffd3ba;border-radius:14px;padding:3px 9px;white-space:nowrap}
.bkband .lead{font-size:11.5px;font-weight:800;color:#7a4a2b;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkband .hot{margin-left:auto;font-size:10px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ff7a45,#f6631e);border-radius:12px;padding:3px 8px;flex:0 0 auto}
.qplays{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:9px;padding-top:9px;border-top:1px dashed #eceff5}
.qplays::-webkit-scrollbar{display:none}
.qp{flex:0 0 auto;background:#f4f6fb;border:1px solid #e7ecf4;border-radius:14px;padding:6px 11px;font-size:11.5px;font-weight:800;color:#59617a;cursor:pointer;transition:.15s}
.qp:hover{border-color:#f6631e;color:var(--orange)}
.qp b{color:var(--orange);font-weight:900}

/* ===== odds button + up/down animation ===== */
.odd{position:relative;background:var(--chip);border:1px solid #e8edf5;border-radius:var(--radius-s);padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;overflow:hidden;transition:transform .08s}
.odd:active{transform:scale(.95)}
.odd:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.odd__lab{font-size:10.5px;font-weight:700;color:var(--mut);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.odd__val{font-size:15px;font-weight:900;color:var(--ink);display:flex;align-items:center;line-height:1}
.odd::after{content:"";position:absolute;right:0;width:9px;opacity:0;pointer-events:none}
.odd.up::after{bottom:0;height:78%;background:linear-gradient(to top,var(--green),rgba(18,184,102,0));clip-path:polygon(100% 0,100% 100%,0 100%);opacity:1;animation:wedgeUp .5s ease}
.odd.dn::after{top:0;height:78%;background:linear-gradient(to bottom,var(--red),rgba(239,59,70,0));clip-path:polygon(100% 0,100% 100%,0 0);opacity:1;animation:wedgeDn .5s ease}
.odd.up{animation:tintUp 1s ease}
.odd.dn{animation:tintDn 1s ease}
.odd.up .odd__val{color:var(--green)}
.odd.dn .odd__val{color:var(--red)}
@keyframes tintUp{0%{background:var(--greenbg)}70%{background:var(--greenbg)}100%{background:var(--chip)}}
@keyframes tintDn{0%{background:var(--redbg)}70%{background:var(--redbg)}100%{background:var(--chip)}}
@keyframes wedgeUp{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes wedgeDn{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
.odd--lock{cursor:default;color:#aab2c4}
.odd--lock .odd__val{color:#b7bfce;font-size:14px}

.empty{text-align:center;color:var(--mut);font-size:13px;font-weight:700;padding:40px 20px}
.legend{display:flex;justify-content:center;gap:16px;padding:4px 0 6px;font-size:11px;font-weight:800;color:var(--mut)}
.legend i{display:inline-block;width:0;height:0;margin-right:4px;vertical-align:middle}
.legend .u{border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid var(--green)}
.legend .d{border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--red)}
.note{font-size:11px;color:var(--mut);text-align:center;padding:2px 0 16px}
</style>
</head>

 {sport:'esports',flag:'🎮',nm:'Dota 2 · TI',sub:'电竞 · BO5',star:false,markets:['Winner','让图','总图'],matches:[
   {type:'std',live:true,time:'Live',more:'36 玩法',
    teams:[['BDS','#1a8877','Team BDS','2'],['MAD','#a12a3a','MAD Lions','3']],
    odds:[[['Home','1.75'],['-1.5','1.90'],['O 3.5','1.90']],[['Away','2.05'],['+1.5','1.90'],['U 3.5','1.90']]]}
 ]}
];

/* ===== render helpers ===== */
var LIVEIC='<span class="liveic" title="滚球直播"><svg viewBox="0 0 24 24">'+
  '<path class="arc a2" d="M4.6 6.2a11 11 0 0 0 0 11.6"/><path class="arc a2" d="M19.4 6.2a11 11 0 0 1 0 11.6"/>'+
  '<path class="arc a1" d="M7.8 9a6.5 6.5 0 0 0 0 6"/><path class="arc a1" d="M16.2 9a6.5 6.5 0 0 1 0 6"/>'+
  '<circle class="dot" cx="12" cy="12" r="2.3"/></svg></span>';
function oddHTML(o){
  if(o[0]==='lock') return '<button class="odd odd--lock" disabled><span class="odd__lab">锁定</span><span class="odd__val">🔒</span></button>';
  return '<button class="odd" data-odd type="button">'+
    '<span class="odd__lab">'+o[0]+'</span>'+
    '<span class="odd__val"><span class="v">'+o[1]+'</span></span></button>';
}
function matchHTML(m,markets){
  var hdr='<div class="mt__hdr"><div></div>'+markets.map(function(x){return '<div class="mt__hcell">'+x+'</div>';}).join('')+'</div>';
  var rows=m.teams.map(function(t,i){
    var cells=m.odds[i].map(oddHTML).join('');
    return '<div class="row"><div class="team"><span class="team__lg" style="background:'+t[1]+'">'+t[0]+'</span>'+
      '<span class="team__nm">'+t[2]+'</span><span class="team__sc">'+t[3]+'</span></div>'+cells+'</div>';
  }).join('');
  var lic=m.live?LIVEIC:'';
  var pill=m.live?'<span class="tpill live">'+m.time+'</span>':'<span class="tpill">'+m.time+'</span>';
  var top='<div class="mt__top">'+lic+pill+'<span class="mt__more">'+m.more+' ›</span></div>';
  var band='',qp='',cls='mt';
  if(m.type==='bk'){
    cls='mt mt--bk';
    if(m.lead||m.hot){
      band='<div class="bkband">'+(m.lead?'<span class="diff">胜分差</span><span class="lead">'+m.lead+'</span>':'<span class="lead">开赛前盘口</span>')+
        (m.hot?'<span class="hot">🔥 '+m.hot+'</span>':'')+'</div>';
    }
    if(m.qplays&&m.qplays.length){
      qp='<div class="qplays">'+m.qplays.map(function(q){return '<button class="qp" type="button">'+q+'</button>';}).join('')+'</div>';
    }
  }
  return '<div class="'+cls+'">'+top+band+hdr+rows+qp+'</div>';
}
function render(){
  var list=DATA.filter(function(l){return l.sport===curSport;});
  var feat=document.getElementById('feat');
  feat.style.display=(curSport==='basketball')?'block':'none';
  if(!list.length){ document.getElementById('wrap').innerHTML='<div class="empty">此球种暂无赛事</div>'; return; }
  document.getElementById('wrap').innerHTML=list.map(function(l){
    var body=l.matches.map(function(m){return matchHTML(m,l.markets);}).join('');
    return '<section class="lg"><div class="lg__h" data-coll>'+
      '<span class="lg__flag">'+l.flag+'</span>'+
      '<div style="min-width:0"><div class="lg__nm">'+l.nm+'</div><div class="lg__sub">'+l.sub+'</div></div>'+
      '<span class="lg__star'+(l.star?' on':'')+'" data-star role="button" aria-label="收藏">'+(l.star?'★':'☆')+'</span>'+
      '<span class="lg__chev">▲</span></div>'+
      '<div class="lg__body">'+body+'</div></section>';
  }).join('');
}
render();

/* ===== interactions ===== */
document.body.addEventListener('click',function(e){
  var st=e.target.closest('[data-star]');
  if(st){ e.stopPropagation(); var on=st.classList.toggle('on'); st.textContent=on?'★':'☆'; return; }
  var h=e.target.closest('[data-coll]');
  if(h){ h.closest('.lg').classList.toggle('collapsed'); return; }
  var sp=e.target.closest('.sptab');
  if(sp){ document.querySelectorAll('.sptab').forEach(function(x){x.classList.remove('on');}); sp.classList.add('on'); curSport=sp.getAttribute('data-sport'); render(); return; }
  var fc=e.target.closest('.fchip');
  if(fc){ document.querySelectorAll('.fchip').forEach(function(x){x.classList.remove('on');}); fc.classList.add('on'); return; }
  var sg=e.target.closest('.seg button');
  if(sg){ sg.parentElement.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); sg.classList.add('on'); return; }
  var od=e.target.closest('[data-odd]');
  if(od){ od.style.borderColor='var(--orange)'; setTimeout(function(){od.style.borderColor='';},250); return; }
});

/* ===== odds up/down animation loop ===== */
function tick(){
  var cells=[].slice.call(document.querySelectorAll('.odd:not(.odd--lock)'));
  if(!cells.length)return;
  var pick=Math.floor(Math.random()*3)+3;
  for(var i=0;i<pick;i++){
    var c=cells[Math.floor(Math.random()*cells.length)];
    if(!c)continue;
    var vEl=c.querySelector('.v'); if(!vEl)continue; var cur=parseFloat(vEl.textContent);
    if(isNaN(cur))continue;
    var up=Math.random()>0.5;
    var delta=(Math.random()*0.06+0.01);
    var nv=up?cur+delta:Math.max(1.01,cur-delta);
    vEl.textContent=nv.toFixed(2);
    c.classList.remove('up','dn'); void c.offsetWidth;
    c.classList.add(up?'up':'dn');
  }
}
setInterval(tick,2200);
setTimeout(tick,600);
</script>
</body>
</html>
