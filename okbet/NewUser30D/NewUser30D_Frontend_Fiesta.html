<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新人30日存款赠金 — 前台原型 (H5) 菲律宾节庆风试作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* =========================================================
   Design Tokens — 沿用 BRD 落地页示意图：暗红底＋金黄字＋礼盒
   ========================================================= */
:root{
  --c-page:#1d1f24;          /* 原型外层背景 */
  --c-bg:#3a1416;            /* 手机内暗红底 */
  --c-bg-2:#2a0e10;
  --c-card:#1f1a1a;          /* 档位卡片底 */
  --c-card-line:#c79a2c;     /* 卡片金框 */
  --c-line:#5a2a2c;
  --c-text:#f6efe6;
  --c-text-2:#d9c7b8;
  --c-text-3:#b39b8a;
  --c-gold:#ffcf3f;
  --c-gold-d:#e0a400;
  --c-red:#e0322f;
  --c-red-d:#b8221f;
  --c-green:#3ec46d;
  --c-orange:#ff8f29;
  --c-gray:#6d6262;
  --c-anno:#ffe27a;          /* 规格标注色 */
  --radius:12px; --radius-s:8px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --font:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;}
html{font-size:18px;}
body{margin:0;font-family:var(--font);background:var(--c-page);color:var(--c-text);line-height:1.5;}
button{font-family:inherit;cursor:pointer;border:none;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-gold);outline-offset:2px;}

/* === Layout：左侧控制面板＋右侧手机 === */
.layout{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:var(--sp-5);max-width:1200px;margin:0 auto;padding:var(--sp-5) var(--sp-4);}
@media (max-width:768px){.layout{grid-template-columns:1fr;}}

/* === Control panel（评审用，不属于前台画面）=== */
.panel{background:#272a31;border-radius:var(--radius);padding:var(--sp-4);color:#e7e9ee;font-size:.72rem;align-self:start;position:sticky;top:var(--sp-4);max-height:calc(100vh - 32px);overflow-y:auto;}
@media (max-width:768px){.panel{position:static;max-height:none;}}
.panel h1{font-size:1rem;margin:0 0 2px;}
.panel__ver{color:#9aa1ad;margin:0 0 var(--sp-3);}
.panel h2{font-size:.78rem;margin:var(--sp-4) 0 var(--sp-2);color:#ffd36b;border-left:3px solid #ffd36b;padding-left:6px;}
.panel__nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.panel__btn{background:#353944;color:#e7e9ee;border-radius:6px;padding:6px 8px;font-size:.7rem;text-align:left;}
.panel__btn:hover{background:#414654;}
.panel__btn--on{background:#ffd36b;color:#2a1b00;font-weight:700;}
.panel__row{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:6px;}
.panel__row label{flex:0 0 96px;color:#c3c8d2;}
.panel__row select{flex:1;min-width:0;background:#353944;color:#fff;border:1px solid #4a505e;border-radius:6px;padding:4px 6px;font-size:.7rem;}
.panel__presets{display:flex;flex-wrap:wrap;gap:6px;}
.panel__notes{background:#1f2127;border-radius:8px;padding:var(--sp-3);}
.panel__notes h3{font-size:.74rem;margin:0 0 6px;color:#fff;}
.panel__notes ol{margin:0;padding-left:1.1em;}
.panel__notes li{margin-bottom:4px;color:#d3d7df;}
.tbc{color:#ffb35c;font-weight:700;}   /* 【待确认】 */
.panel__log{margin-top:6px;background:#1a1c21;border-radius:6px;padding:6px 8px;color:#a9e6b8;font-family:monospace;font-size:.68rem;max-height:120px;overflow:auto;white-space:pre-wrap;}

/* === Phone frame === */
.stage{display:flex;justify-content:center;}
.phone{width:100%;max-width:360px;height:740px;background:linear-gradient(180deg,var(--c-bg),var(--c-bg-2));border-radius:28px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;border:6px solid #0d0d0f;}
.phone__scroll{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;}

/* === App bars === */
.appbar{display:flex;align-items:center;gap:var(--sp-2);padding:10px var(--sp-3);background:#fff;color:#1a2a55;position:sticky;top:0;z-index:5;}
.appbar__back{background:none;color:#1a2a55;font-size:1.1rem;padding:0 4px;}
.appbar__title{flex:1;text-align:center;font-weight:700;font-size:.9rem;margin:0;padding-right:28px;}
.topbar{display:flex;align-items:center;gap:var(--sp-2);padding:10px var(--sp-3);background:#2a0e10;position:sticky;top:0;z-index:5;}
.topbar__logo{font-weight:800;color:var(--c-gold);font-size:1rem;}
.topbar__sp{flex:1;}
.topbar__bal{background:rgba(255,255,255,.08);border-radius:16px;padding:3px 10px;font-size:.72rem;}
.btn-dep-sm{background:var(--c-red);color:#fff;border-radius:16px;padding:4px 12px;font-size:.72rem;font-weight:700;}
.tabbar{display:flex;align-items:flex-end;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(20,30,60,.12);position:relative;z-index:6;}
.tabbar__item{flex:1;background:none;color:#8a93a8;display:flex;flex-direction:column;align-items:center;padding:6px 0 8px;font-size:.7rem;gap:2px;position:relative;}
.tabbar__item--on{color:#1677ff;font-weight:700;}
.tabbar__logo{width:40px;height:40px;margin-top:-14px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#4f9bff,#1677ff);color:#fff;font-weight:900;font-size:1.1rem;box-shadow:0 4px 10px rgba(22,119,255,.4);border:3px solid #fff;}
.dot-red{position:absolute;top:6px;right:calc(50% - 14px);width:8px;height:8px;border-radius:50%;background:#ff3b30;}
.tabbar__ic{font-size:1.05rem;}
.dot-badge{position:absolute;top:4px;right:calc(50% - 18px);background:var(--c-red);color:#fff;border-radius:9px;font-size:.67rem;min-width:16px;padding:0 4px;line-height:16px;}

/* === Buttons === */
.btn{border-radius:var(--radius-s);padding:8px 14px;font-weight:700;font-size:.78rem;}
.btn--deposit{background:linear-gradient(180deg,#ff5a4f,var(--c-red-d));color:#fff;box-shadow:0 2px 0 #7a0f0d;}
.btn--claim{background:linear-gradient(180deg,#ffe066,var(--c-gold-d));color:#3a2100;box-shadow:0 2px 0 #8a6200;}
.btn--ghost{background:rgba(255,255,255,.1);color:var(--c-text);}
.btn--block{display:block;width:100%;padding:12px;font-size:.85rem;}
.btn:disabled{opacity:.55;cursor:default;box-shadow:none;}
.btn:hover:not(:disabled){filter:brightness(1.08);}
.btn:active:not(:disabled){transform:translateY(1px);}

/* === 规格标注（画面中黄色虚线框，前台不渲染）=== */
.anno{border:1px dashed var(--c-anno);color:var(--c-anno);background:rgba(255,226,122,.07);border-radius:6px;font-size:.67rem;padding:4px 8px;margin:6px var(--sp-3);line-height:1.45;}
.anno b{color:#fff;}
.ui-tag{display:inline-block;background:var(--c-anno);color:#3a2a00;font-size:.67rem;font-weight:800;border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:middle;}

/* === Home === */
.home-banner{margin:var(--sp-3);height:110px;border-radius:var(--radius);background:linear-gradient(120deg,#6b1d1d,#b8401c);display:flex;align-items:flex-end;padding:var(--sp-3);font-weight:800;}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);padding:0 var(--sp-3) var(--sp-3);}
.games__item{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:1.6rem;}
.sec-h{font-size:.85rem;font-weight:800;margin:var(--sp-3) var(--sp-3) var(--sp-2);color:var(--c-gold);}

/* UI 01 Home 新人入口卡 */
.entry{margin:0 var(--sp-3);border-radius:var(--radius);background:linear-gradient(120deg,#5a1416,#8a2020);border:1px solid var(--c-card-line);padding:var(--sp-3);display:flex;gap:var(--sp-3);align-items:center;}
.entry__gift{font-size:2.2rem;flex:0 0 auto;}
.entry__body{flex:1;min-width:0;}
.entry__title{font-weight:800;font-size:.85rem;color:var(--c-gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry__desc{font-size:.7rem;color:var(--c-text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.entry__bar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden;}
.entry__fill{height:100%;background:linear-gradient(90deg,var(--c-gold),var(--c-orange));}
.entry__cta{flex:0 0 auto;}

/* === Landing（UI 04 / 06）=== */
.hero{position:relative;text-align:center;padding:var(--sp-4) var(--sp-3) var(--sp-2);}
.hero__gift{font-size:4rem;line-height:1;}
.hero__title{margin:6px 0 0;font-size:1.25rem;font-weight:900;color:var(--c-gold);text-shadow:0 2px 0 #6b2b00;letter-spacing:.5px;}
.hero__sub{font-size:.72rem;color:var(--c-text-2);margin:2px 0 0;}
.hero__rules{position:absolute;right:0;top:var(--sp-4);background:rgba(255,255,255,.18);color:#fff;font-weight:800;border-radius:16px 0 0 16px;padding:6px 12px 6px 16px;font-size:.78rem;}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:var(--sp-2) var(--sp-3);}
.info__cell{background:rgba(0,0,0,.25);border-radius:var(--radius-s);padding:6px;text-align:center;}
.info__k{font-size:.67rem;color:var(--c-text-3);display:block;}
.info__v{font-size:.8rem;font-weight:800;color:var(--c-gold);}
.lv{display:inline-block;background:linear-gradient(180deg,#ffe066,#e0a400);color:#3a2100;border-radius:6px;padding:0 6px;font-weight:900;}

.daily{display:flex;align-items:center;justify-content:space-between;margin:var(--sp-4) var(--sp-3) var(--sp-2);}
.daily__title{font-size:1.05rem;font-weight:900;color:var(--c-gold);margin:0;}
.daily__cd{font-weight:800;color:var(--c-gold);font-variant-numeric:tabular-nums;font-size:.85rem;}
.daily__cd small{display:block;font-size:.67rem;color:var(--c-text-3);font-weight:400;text-align:right;}

/* 共用进度条＋三个里程碑 */
.prog{margin:0 var(--sp-3);background:rgba(0,0,0,.3);border-radius:var(--radius);padding:var(--sp-3) var(--sp-3) var(--sp-2);}
.prog__head{display:flex;justify-content:space-between;align-items:baseline;font-size:.72rem;color:var(--c-text-2);}
.prog__amt{font-size:1.05rem;font-weight:900;color:#fff;}
.prog__amt small{font-size:.72rem;color:var(--c-text-3);font-weight:400;}
.prog__track{position:relative;height:12px;border-radius:6px;background:#fff;margin:22px 4px 30px;}
.prog__fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:repeating-linear-gradient(90deg,var(--c-red) 0 10px,#1f8a3a 10px 20px);transition:width .5s;}
.ms{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;}
.ms__dot{width:20px;height:20px;border-radius:50%;background:#5b4a4a;border:2px solid #fff;display:grid;place-items:center;font-size:.67rem;color:#fff;}
.ms--hit .ms__dot{background:var(--c-gold);color:#3a2100;}
.ms__top{position:absolute;bottom:22px;white-space:nowrap;font-size:.67rem;font-weight:800;color:var(--c-gold);}
.ms__bot{position:absolute;top:22px;white-space:nowrap;font-size:.67rem;color:var(--c-text-2);}
.prog__hint{font-size:.74rem;color:var(--c-text);text-align:center;margin:0;}
.prog__hint b{color:var(--c-gold);}

/* 档位卡片 */
.tiers{list-style:none;margin:var(--sp-3) 0 0;padding:0 var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-4);}
.tier{position:relative;background:var(--c-card);border:1px solid var(--c-card-line);border-radius:var(--radius-s);padding:var(--sp-3);padding-top:22px;display:flex;gap:var(--sp-3);align-items:center;}
.tier__flag{position:absolute;left:-4px;top:-12px;background:var(--c-red);color:#fff;font-weight:900;font-size:.72rem;padding:2px 10px 2px 26px;border-radius:4px;box-shadow:0 2px 0 #7a0f0d;}
.tier__flag::before{content:"★";position:absolute;left:6px;color:var(--c-gold);}
.tier__gift{font-size:2.4rem;flex:0 0 auto;width:56px;text-align:center;}
.tier__body{flex:1;min-width:0;}
.tier__name{font-size:.78rem;color:var(--c-text);margin:0;}
.tier__name em{font-style:normal;color:var(--c-gold);font-weight:800;}
.tier__sub{font-size:.68rem;color:var(--c-text-3);margin:2px 0 6px;}
.tier__act{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.chip{font-size:.67rem;font-weight:800;border-radius:10px;padding:2px 8px;white-space:nowrap;}
.chip--proc{background:rgba(255,143,41,.18);color:#ffb067;}
.chip--ok{background:rgba(62,196,109,.18);color:#6be093;}
.chip--lock{background:rgba(255,255,255,.08);color:var(--c-text-3);}
.chip--exp{background:rgba(255,255,255,.06);color:#a99;}
.tier--claimable{border-color:var(--c-gold);box-shadow:0 0 0 2px rgba(255,207,63,.35);}
.tier--focus{animation:pulse 1.2s ease 2;}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,207,63,.55);}}

.claim-all{margin:var(--sp-3);}
.done-box{margin:var(--sp-3);border-radius:var(--radius-s);background:rgba(0,0,0,.25);}
.done-box summary{padding:var(--sp-2) var(--sp-3);font-size:.76rem;font-weight:700;color:var(--c-text-2);cursor:pointer;}
.done-box ul{list-style:none;margin:0;padding:0 var(--sp-3) var(--sp-2);}
.done-box li{display:flex;justify-content:space-between;font-size:.72rem;padding:4px 0;border-top:1px dashed var(--c-line);}
.allclear{margin:var(--sp-3);text-align:center;background:var(--c-card);border:1px solid var(--c-card-line);border-radius:var(--radius-s);padding:var(--sp-4) var(--sp-3);font-size:.78rem;}
.allclear b{color:var(--c-gold);font-variant-numeric:tabular-nums;}

/* Your Rewards（往日待领） */
.yr{margin:var(--sp-4) var(--sp-3);}
.yr__h{display:flex;justify-content:space-between;align-items:center;}
.yr__h h3{margin:0;font-size:.9rem;color:var(--c-gold);}
.link{background:none;color:var(--c-text-2);font-size:.72rem;text-decoration:underline;}
.yr__list{list-style:none;margin:var(--sp-2) 0 0;padding:0;display:flex;flex-direction:column;gap:6px;}
.yr__item{display:flex;align-items:center;gap:var(--sp-2);background:rgba(0,0,0,.25);border-radius:var(--radius-s);padding:var(--sp-2) var(--sp-3);font-size:.72rem;}
.yr__item div{flex:1;min-width:0;}
.yr__item small{display:block;color:var(--c-text-3);font-size:.67rem;}
.yr__empty{font-size:.72rem;color:var(--c-text-3);text-align:center;padding:var(--sp-3);background:rgba(0,0,0,.2);border-radius:var(--radius-s);}

/* 状态页（未登录 / 错误 / 等待配发 / 结束） */
.state{margin:var(--sp-5) var(--sp-4);text-align:center;background:rgba(0,0,0,.25);border-radius:var(--radius);padding:var(--sp-5) var(--sp-4);}
.state__ic{font-size:2.4rem;}
.state__t{font-weight:800;margin:var(--sp-2) 0 4px;font-size:.9rem;}
.state__d{font-size:.74rem;color:var(--c-text-2);margin:0 0 var(--sp-3);}
.skel{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;margin:var(--sp-3);}
@keyframes sk{to{background-position:-200% 0;}}
.banner-warn{margin:var(--sp-2) var(--sp-3);background:rgba(255,143,41,.15);border:1px solid rgba(255,143,41,.5);color:#ffc58f;border-radius:var(--radius-s);padding:var(--sp-2) var(--sp-3);font-size:.72rem;}

/* === Rewards 页（UI 03） === */
.rw-banner{margin:var(--sp-3);border-radius:var(--radius);padding:var(--sp-3);background:linear-gradient(120deg,#7a1c1c,#c0392b);border:1px solid var(--c-gold);display:flex;align-items:center;gap:var(--sp-3);}
.rw-banner__t{font-weight:900;color:var(--c-gold);font-size:.85rem;margin:0;}
.rw-banner__d{font-size:.7rem;margin:0;color:#fff;}
.promo{margin:0 var(--sp-3) var(--sp-2);height:72px;border-radius:var(--radius-s);background:rgba(255,255,255,.07);display:flex;align-items:center;padding:0 var(--sp-3);font-size:.78rem;color:var(--c-text-2);}

/* === MY（UI 10）=== */
.me{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-3);}
.me__av{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffb066,#c9701f);}
.me__name{font-weight:800;}
.me__vip{font-size:.67rem;color:var(--c-text-3);}
.menu{list-style:none;margin:0 var(--sp-3);padding:0;background:rgba(0,0,0,.25);border-radius:var(--radius);}
.menu__item{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3);border-bottom:1px solid var(--c-line);font-size:.78rem;width:100%;background:none;color:var(--c-text);text-align:left;}
.menu li:last-child .menu__item{border-bottom:none;}
.menu__item span:first-child{flex:1;}
.menu__badge{background:var(--c-red);color:#fff;border-radius:9px;font-size:.67rem;padding:0 6px;}

/* === Reward History（UI 11）=== */
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 4px;margin:var(--sp-3) var(--sp-3) var(--sp-2);padding-top:4px;}
.cal__d{background:rgba(0,0,0,.28);border-radius:6px;padding:4px 0;text-align:center;font-size:.67rem;color:var(--c-text-3);}
.cal__d b{display:block;font-size:.72rem;color:var(--c-text);}
.cal__pips{display:flex;justify-content:center;gap:2px;margin-top:2px;}
.cal__pips i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);}
.cal__pips i.on{background:var(--c-gold);}
button.cal__d{font-family:inherit;border:1px solid transparent;cursor:pointer;color:var(--c-text-2);}
button.cal__d:hover{border-color:rgba(255,207,63,.6);}
.cal__d{position:relative;}
.cal__date{display:block;font-size:.67rem;color:var(--c-text-3);line-height:1.2;}
.cal__d--past{opacity:.55;cursor:default;}
.cal__d--future{background:rgba(255,255,255,.06);cursor:default;}
.cal__d--sel{border-color:#fff !important;background:rgba(255,255,255,.14);}
/* 今日：金色实底＋TODAY 标签＋呼吸光圈 */
.cal__d--today{background:linear-gradient(180deg,#ffe066,#e0a400);color:#3a2100;border-color:#fff2b0;animation:breathe 2s ease-in-out infinite;}
.cal__d--today b,.cal__d--today .cal__date{color:#3a2100;}
.cal__d--today .cal__pips i{background:rgba(58,33,0,.25);}
.cal__d--today .cal__pips i.on{background:#b8221f;}
.cal__d--today.cal__d--sel{border-color:#fff !important;background:linear-gradient(180deg,#ffe066,#e0a400);}
.cal__tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--c-red);color:#fff;font-size:.67rem;font-weight:900;line-height:1;padding:2px 4px;border-radius:4px;white-space:nowrap;}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,207,63,.7);}50%{box-shadow:0 0 0 5px rgba(255,207,63,0),0 0 12px 2px rgba(255,207,63,.55);}}
@media (prefers-reduced-motion:reduce){.cal__d--today{animation:none;box-shadow:0 0 0 3px rgba(255,207,63,.5);}}
/* 点击日期后的当日奖励 */
.dd{margin:var(--sp-2) var(--sp-3) 0;background:rgba(0,0,0,.3);border:1px solid var(--c-line);border-radius:var(--radius);padding:var(--sp-3);}
.dd--today{border-color:var(--c-gold);}
.dd__h{display:flex;justify-content:space-between;align-items:baseline;}
.dd__t{font-weight:900;color:var(--c-gold);font-size:.85rem;}
.dd__date{font-size:.7rem;color:var(--c-text-3);}
.dd__sum{font-size:.72rem;color:var(--c-text-2);margin:2px 0 var(--sp-2);}
.dd__sum b{color:var(--c-gold);}
.dd__exp{margin:8px 0 0;font-size:.7rem;color:#ffe7a0;}
.dd__exp b{color:var(--c-gold);font-variant-numeric:tabular-nums;}
.dd .mini--flat{margin:0;}
.nw{white-space:nowrap;}
.mini--flat .mini__i{background:rgba(255,255,255,.05);}
.legend{font-size:.67rem;color:var(--c-text-3);margin:0 var(--sp-3);}
.tabs{display:flex;gap:6px;margin:var(--sp-3);overflow-x:auto;}
.tabs__t{background:rgba(255,255,255,.08);color:var(--c-text-2);border-radius:14px;padding:4px 12px;font-size:.7rem;white-space:nowrap;}
.tabs__t--on{background:var(--c-gold);color:#3a2100;font-weight:800;}
.hist{width:calc(100% - 24px);margin:0 var(--sp-3) var(--sp-4);border-collapse:collapse;font-size:.68rem;}
.hist th{color:var(--c-text-3);font-weight:400;text-align:left;padding:4px;border-bottom:1px solid var(--c-line);}
.hist td{padding:6px 4px;border-bottom:1px dashed var(--c-line);vertical-align:middle;}
.hist .btn{padding:4px 8px;font-size:.67rem;}

/* === Overlays === */
.mask{position:absolute;inset:0;background:rgba(10,2,2,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:var(--sp-4);}
.mask--sheet{align-items:flex-end;padding:0;}
.dlg{background:#fff;color:#2a1a1a;border-radius:16px;width:100%;max-width:300px;padding:var(--sp-5) var(--sp-4) var(--sp-4);text-align:center;position:relative;}
.dlg__x{position:absolute;right:10px;top:8px;background:none;font-size:1.1rem;color:#888;}
.dlg__ic{font-size:2.6rem;margin-top:-6px;}
.dlg__t{font-weight:900;font-size:.95rem;margin:4px 0;}
.dlg__d{font-size:.74rem;color:#5a4a4a;margin:0 0 var(--sp-3);}
.dlg__amt{font-size:1.4rem;font-weight:900;color:var(--c-red);margin:4px 0;}
.dlg__btns{display:flex;flex-direction:column;gap:6px;}
.popup{background:linear-gradient(180deg,#7a1c1c,#3a0f10);color:#fff;border:2px solid var(--c-gold);}
.popup .dlg__d{color:#f1dcdc;}
.popup .dlg__x{color:#fff;}
.sheet{background:#fff;color:#2a1a1a;width:100%;border-radius:16px 16px 0 0;padding:var(--sp-4);max-height:88%;overflow-y:auto;}
.sheet__h{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-3);}
.sheet__h h2{margin:0;font-size:.95rem;}
.field{display:block;font-size:.72rem;color:#5a4a4a;margin-bottom:4px;}
.input{width:100%;border:1px solid #d8c8c8;border-radius:8px;padding:10px;font-size:1rem;font-weight:800;}
.input--err{border-color:var(--c-red);}
.err{color:var(--c-red);font-size:.68rem;margin:4px 0 0;}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:var(--sp-2) 0;}
.quick__b{background:#f5eeee;color:#4a2a2a;border-radius:16px;padding:4px 10px;font-size:.7rem;border:1px solid #e3d4d4;}
.quick__b--hint{background:#fff6d6;border-color:#f0c95a;color:#7a5200;font-weight:700;}
.preview{background:#fff8e6;border:1px solid #f0d58a;border-radius:8px;padding:var(--sp-2) var(--sp-3);font-size:.72rem;color:#5a3d00;margin:var(--sp-2) 0 var(--sp-3);}
.preview b{color:#b8221f;}
.preview--warn{background:#fff0ea;border-color:#f3b49a;color:#8a2a10;}
.pay{display:flex;gap:6px;margin-bottom:var(--sp-3);}
.pay label{flex:1;border:1px solid #e3d4d4;border-radius:8px;padding:6px;font-size:.72rem;text-align:center;cursor:pointer;}
.pay input{margin-right:4px;}
.rules{font-size:.74rem;color:#3a2a2a;}
.rules ol{padding-left:1.2em;margin:0 0 var(--sp-3);}
.rules li{margin-bottom:6px;}
.rules table{width:100%;border-collapse:collapse;margin:var(--sp-2) 0;font-size:.7rem;}
.rules th,.rules td{border:1px solid #e3d4d4;padding:4px;text-align:center;}
.rules th{background:#f8efe8;}
.rules .anno{margin:6px 0;color:#8a5a00;border-color:#d9a400;background:#fff8dc;}

.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,10,10,.92);color:#fff;font-size:.74rem;padding:8px 14px;border-radius:20px;z-index:40;max-width:85%;text-align:center;}
.toast--err{background:rgba(160,20,20,.95);}

/* === v0.2 新增：MY 可领卡 / Your Rewards 页 / 过期提醒 === */
.mycard{margin:var(--sp-3);border-radius:var(--radius);background:linear-gradient(120deg,#5a1416,#8a2020);border:1px solid var(--c-gold);padding:var(--sp-3);}
.mycard__top{display:flex;align-items:center;gap:var(--sp-3);}
.mycard__amt{font-size:1.3rem;font-weight:900;color:var(--c-gold);margin:0;}
.mycard__d{font-size:.7rem;color:var(--c-text-2);margin:0;}
.bal{display:flex;gap:var(--sp-2);margin:0 var(--sp-3);}
.bal__c{flex:1;background:rgba(0,0,0,.25);border-radius:var(--radius-s);padding:var(--sp-2);text-align:center;}
.bal__k{display:block;font-size:.67rem;color:var(--c-text-3);}
.bal__v{font-weight:800;}
.bal__v--flash{color:var(--c-gold);}
.expire{margin:var(--sp-2) var(--sp-3) 0;background:rgba(255,207,63,.12);border:1px solid rgba(255,207,63,.5);color:#ffe7a0;border-radius:var(--radius-s);padding:var(--sp-2) var(--sp-3);font-size:.72rem;}
.expire b{color:var(--c-gold);font-variant-numeric:tabular-nums;}
.yr-entry{margin:var(--sp-4) var(--sp-3);display:flex;align-items:center;gap:var(--sp-3);width:calc(100% - 24px);background:rgba(0,0,0,.28);border:1px solid var(--c-line);border-radius:var(--radius-s);padding:var(--sp-3);color:var(--c-text);text-align:left;}
.yr-entry__t{font-weight:800;color:var(--c-gold);font-size:.85rem;}
.yr-entry__d{font-size:.7rem;color:var(--c-text-2);}
.d30{margin:0 var(--sp-3);background:rgba(0,0,0,.28);border-radius:var(--radius);padding:var(--sp-3);}
.d30__row{display:flex;justify-content:space-between;font-size:.72rem;color:var(--c-text-2);}
.d30__row b{color:#fff;font-size:.85rem;}
.d30__bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin:6px 0 4px;overflow:hidden;}
.d30__fill{height:100%;background:linear-gradient(90deg,var(--c-gold),var(--c-orange));}
.mini{list-style:none;margin:0 var(--sp-3);padding:0;display:flex;flex-direction:column;gap:6px;}
.mini__i{display:flex;align-items:center;gap:var(--sp-2);background:rgba(0,0,0,.25);border-radius:var(--radius-s);padding:var(--sp-2) var(--sp-3);font-size:.74rem;}
.mini__i div{flex:1;min-width:0;}
.mini__i small{display:block;color:var(--c-text-3);font-size:.67rem;}
.btn--sm{padding:6px 12px;font-size:.72rem;}
.steps{margin:0 var(--sp-3) var(--sp-3);background:rgba(0,0,0,.3);border:1px solid var(--c-card-line);border-radius:var(--radius);padding:var(--sp-3);}
.steps__h{margin:0 0 var(--sp-2);font-size:.85rem;color:var(--c-gold);}
.steps__l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--sp-2);}
.step{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);border-radius:var(--radius-s);background:rgba(255,255,255,.04);}
.step__n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:900;background:rgba(255,255,255,.12);color:var(--c-text-2);}
.step__b{flex:1;min-width:0;}
.step__t{margin:0;font-size:.76rem;font-weight:700;}
.step__d{margin:0;font-size:.67rem;color:var(--c-text-3);}
.step--cur{background:rgba(255,207,63,.10);outline:1px solid rgba(255,207,63,.6);}
.step--cur .step__n{background:var(--c-gold);color:#3a2100;}
.step--done .step__n{background:var(--c-green);color:#06331d;}
.step--todo{opacity:.7;}
.kycbar{display:flex;align-items:center;gap:var(--sp-2);margin:0 var(--sp-3) var(--sp-3);background:rgba(62,196,109,.12);border:1px solid rgba(62,196,109,.5);color:#c9f2d6;border-radius:var(--radius-s);padding:var(--sp-2) var(--sp-3);font-size:.72rem;}
.kycbar span:nth-child(2){flex:1;min-width:0;}
.sheet--dark{background:linear-gradient(180deg,#3a1416,#2a0e10);color:var(--c-text);border-top:2px solid var(--c-gold);display:flex;flex-direction:column;}
.sheet--dark .sheet__h h2{color:var(--c-gold);}
.dlg__x--light{color:var(--c-text-2);}
.sheet__scroll{overflow-y:auto;max-height:52vh;}

/* === 首页（参考 okbet.com 手机版一般首页结构，浅色）=== */
.home{background:#f2f4f8;color:#1b2340;position:relative;}
.hbar{position:sticky;top:8px;z-index:5;margin:8px var(--sp-2) 0;display:flex;align-items:center;gap:var(--sp-2);padding:6px var(--sp-2);border-radius:14px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(20,30,60,.15);}
.hbar__av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:0 0 auto;display:block;box-shadow:0 0 0 2px #fff;}
.hbar__bal{display:flex;flex-direction:column;font-size:.72rem;font-weight:800;line-height:1.3;color:#1b2340;}
.hbar__bal>span{display:flex;align-items:center;gap:4px;}
.hbar__r{color:#1677ff;font-weight:400;}
.coin{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font-style:normal;font-size:.67rem;color:#fff;font-weight:900;line-height:1;}
.coin--p{background:#ff8a1f;}
.coin--b{background:#e5383b;}
.hbar__dep{background:linear-gradient(180deg,#3d8bff,#1667e8);color:#fff;font-weight:800;border-radius:8px;padding:8px 14px;font-size:.78rem;box-shadow:0 2px 0 #0d4fb8;}
.hbar__search{background:none;font-size:1rem;color:#1677ff;padding:4px;}
.bn{position:relative;margin-top:-52px;padding-top:34px;background:#2f6bff;}
.bn__svg{display:block;width:100%;aspect-ratio:750/360;height:auto;}
.bn__dots{position:absolute;bottom:22px;right:14px;display:flex;gap:5px;}
.bn__dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);}
.bn__dots i.on{background:#fff;width:14px;border-radius:3px;}
.hsheet{position:relative;margin-top:-14px;background:#fff;border-radius:18px 18px 0 0;padding:var(--sp-3) 0 var(--sp-5);}
.hsheet .entry{margin-bottom:var(--sp-2);gap:var(--sp-2);}
.hsheet .entry .btn{padding:6px 10px;font-size:.72rem;}
.hsheet .entry__gift{font-size:1.8rem;}
.anno--light{color:#8a5a00;border-color:#d9a400;background:#fff8dc;}
.hs-row{display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-4) var(--sp-3) var(--sp-2);}
.hs-row .hs-h{margin:0;}
.hs-h{font-size:.95rem;font-weight:900;color:#1b2340;margin:var(--sp-3) var(--sp-3) var(--sp-2);}
.upto{background:linear-gradient(90deg,#7a3dff,#c23dff);color:#ffe066;font-weight:900;font-style:italic;font-size:.67rem;border-radius:6px;padding:1px 6px;border:1px solid #ffcf3f;white-space:nowrap;}
.gt{position:relative;list-style:none;aspect-ratio:1;border-radius:12px;background:var(--g);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(20,30,60,.15);}
.gt--s{flex:0 0 auto;width:64px;height:84px;aspect-ratio:auto;border:1px solid rgba(255,207,63,.7);}
.gt__p{position:absolute;top:0;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.45);color:#fff;font-size:.67rem;padding:0 6px;border-radius:0 0 6px 6px;white-space:nowrap;}
.gt__fav{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);color:#e5383b;font-size:.72rem;display:grid;place-items:center;padding:0;}
.gt__e{font-size:1.8rem;line-height:1;margin-top:6px;}
.gt--s .gt__e{font-size:1.4rem;}
.gt__n{font-weight:900;color:#fff;font-size:.7rem;text-align:center;line-height:1.15;padding:2px 4px 0;text-shadow:0 1px 2px rgba(0,0,0,.5);}
.hscroll{list-style:none;margin:0;padding:0 var(--sp-3);display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none;}
.cats{list-style:none;margin:var(--sp-3) 0 0;padding:0 var(--sp-3);display:flex;gap:var(--sp-1);overflow-x:auto;scrollbar-width:none;}
.cat{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:#6b7590;padding:4px 8px;border-radius:12px;}
.cat__ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:#f2f4f8;}
.cat--on{color:#1677ff;font-weight:700;}
.cat--on .cat__ic{background:radial-gradient(circle,#ffe2cc,#ffd0a8);box-shadow:0 0 0 2px #ffb27a;}
.ggrid{list-style:none;margin:0;padding:0 var(--sp-3);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2);}
.cs{position:absolute;right:10px;bottom:84px;z-index:7;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#4f9bff,#1677ff);color:#fff;font-size:1.1rem;box-shadow:0 4px 10px rgba(22,119,255,.45);}

/* === UI 07 充值页（参考 okbet.com Wallet 充值页，浅色）=== */
.dep{background:#f4f5f8;color:#1b2340;}
.dep__bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;background:#fff;padding:10px var(--sp-3);}
.dep__back{background:none;font-size:1.3rem;color:#1b2340;width:32px;text-align:left;}
.dep__title{flex:1;text-align:center;margin:0;font-size:.9rem;font-weight:600;}
.dep__rec{background:none;color:#7b8499;font-size:.78rem;width:56px;text-align:right;}
.dep__bal{display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-3);padding:var(--sp-4) var(--sp-3);border-radius:12px;background:linear-gradient(180deg,#fff,#e6efff);box-shadow:0 1px 4px rgba(20,30,60,.08);}
.dep__amt{display:flex;align-items:center;gap:6px;font-size:1.2rem;font-weight:900;color:#1667e8;}
.dep__ref{background:none;color:#9aa3b5;font-size:1rem;}
.dep__fund{background:#1667e8;color:#fff;border-radius:6px;padding:6px 10px;font-size:.7rem;font-weight:700;white-space:nowrap;}
.dep__sec{background:#fff;padding:var(--sp-3);margin-bottom:var(--sp-2);}
.dep__h{margin:0 0 var(--sp-2);font-size:.8rem;font-weight:500;}
.dep__tabs{display:flex;gap:6px;margin-bottom:var(--sp-3);overflow-x:auto;scrollbar-width:none;}
.dep__tab{flex:0 0 auto;white-space:nowrap;border:1px solid #e1e4ea;background:#fff;color:#7b8499;border-radius:16px;padding:4px 10px;font-size:.7rem;}
.dep__tab--on{background:#1667e8;border-color:#1667e8;color:#fff;font-weight:700;}
.dep__ch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2);}
.dep__chb{border:1px solid #e1e4ea;background:#fff;border-radius:10px;padding:12px 4px;font-weight:900;font-size:.85rem;color:#2a3550;}
.dep__chb--on{border-color:#1667e8;background:#eef4ff;color:#1667e8;}
.dep__note{font-size:.72rem;color:#7b8499;margin:0;}
.dep__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2);}
.dep__add{border:1px solid #e1e4ea;background:#fff;border-radius:8px;padding:10px 0;font-size:.8rem;color:#5d6780;}
.dep__add:active{background:#eef4ff;border-color:#1667e8;}
.dep__input{width:100%;margin-top:var(--sp-2);border:1px solid #e1e4ea;border-radius:8px;padding:12px;font-size:.9rem;color:#1b2340;}
.dep__input--err{border-color:#e5383b;}
.dep__submit{display:block;width:100%;margin-top:var(--sp-3);background:#1667e8;color:#fff;border-radius:8px;padding:12px;font-size:.85rem;}
.dep__submit:disabled{background:#8fb6ff;cursor:default;}
.dep-pr{margin:0 var(--sp-3) var(--sp-2);border-radius:12px;padding:var(--sp-3);background:linear-gradient(120deg,#5a1416,#8a2020);border:1px solid var(--c-card-line);color:#fff;}
.dep-pr__top{display:flex;align-items:center;gap:6px;font-size:.8rem;}
.dep-pr__top b{color:var(--c-gold);}
.dep-pr__day{margin-left:auto;font-size:.67rem;color:var(--c-text-2);}
.dep-pr__bar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin:8px 0 4px;overflow:hidden;}
.dep-pr__bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-gold),var(--c-orange));}
.dep-pr__t{margin:0;font-size:.67rem;color:var(--c-text-2);}
.dep-pr__line{margin:6px 0 0;font-size:.74rem;}
.dep-pr__bonus{color:var(--c-gold);white-space:nowrap;}
.dep-pr__warn{color:#ffc58f;}
.dep-pr__fills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.dep-pr__fill{background:rgba(255,207,63,.15);border:1px solid rgba(255,207,63,.6);color:#ffe7a0;border-radius:14px;padding:3px 10px;font-size:.7rem;font-weight:700;}

/* === UI 01 首页新人任务卡（左右滑动）=== */
.hq{margin:0 0 var(--sp-2);}
.hq__head{display:flex;align-items:center;gap:var(--sp-2);margin:0 var(--sp-3) var(--sp-2);}
.hq__gift{font-size:1.6rem;}
.hq__ht{flex:1;min-width:0;}
.hq__title{margin:0;font-size:.9rem;font-weight:900;color:#1b2340;}
.hq__sub{margin:0;font-size:.7rem;color:#6b7590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hq__sub b{color:#c2410c;font-variant-numeric:tabular-nums;}
.hq__more{background:none;color:#1677ff;font-size:.74rem;font-weight:700;white-space:nowrap;}
.hq__track{list-style:none;margin:0;padding:2px var(--sp-3) 4px;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 var(--sp-3);scrollbar-width:none;}

.hq__card--done{opacity:.75;}
.hq__row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);}
.hq__tier{background:var(--c-red);color:#fff;font-size:.67rem;font-weight:900;border-radius:4px;padding:1px 8px;}
.hq__bonus{color:var(--c-gold);font-weight:900;font-size:.95rem;}
.hq__name{margin:4px 0 6px;font-size:.8rem;font-weight:700;}
.hq__bar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;margin-bottom:6px;}

.hq__prog{font-size:.67rem;color:var(--c-text-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hq__dots{display:flex;justify-content:center;gap:5px;margin-top:6px;}
.hq__dots i{width:6px;height:6px;border-radius:50%;background:#cfd5e2;}
.hq__dots i.on{background:#1677ff;width:14px;border-radius:3px;}

/* === 浅色页面共用 === */
.light .anno{color:#8a5a00;border-color:#d9a400;background:#fff8dc;}
.light .anno b{color:#5a3a00;}
.lt{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--sp-2);padding:8px var(--sp-3);background:#fff;box-shadow:0 1px 0 #eef0f4;}
.lt__menu{background:none;color:#1667e8;font-size:1.1rem;}
.lt__pts{display:flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:#1b2340;}
/* === UI 03 Rewards 页（参考 okbet.com Rewards）=== */

.rw__stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin:var(--sp-3);}
.rw__stat{position:relative;text-align:left;border-radius:12px;padding:var(--sp-3);overflow:hidden;color:#1b2340;}
.rw__stat b{display:block;font-size:1.05rem;}

.rw__stat i{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-style:normal;font-size:1.8rem;}
.rw__stat--pt{background:linear-gradient(120deg,#fff6ea,#ffe9cf);}
.rw__stat--vc{background:linear-gradient(120deg,#eef4ff,#dce8ff);}
.rw__sec{margin:0 var(--sp-3) var(--sp-4);}
.rw__h{display:flex;align-items:center;gap:6px;font-size:.95rem;font-weight:900;margin:0 0 var(--sp-2);}

/* === 底部弹窗动画：由下向上展开／由上向下收起 === */
.mask--sheet.anim-in{animation:maskIn .25s ease-out;}
.mask--sheet.anim-in .sheet{animation:sheetUp .3s cubic-bezier(.2,.8,.2,1);}
.mask--sheet.anim-out{animation:maskOut .24s ease-in forwards;}
.mask--sheet.anim-out .sheet{animation:sheetDown .24s ease-in forwards;}
@keyframes maskIn{from{background:rgba(10,2,2,0);}}
@keyframes maskOut{to{background:rgba(10,2,2,0);}}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
@keyframes sheetDown{from{transform:translateY(0);}to{transform:translateY(100%);}}
@media (prefers-reduced-motion:reduce){.mask--sheet.anim-in,.mask--sheet.anim-in .sheet,.mask--sheet.anim-out,.mask--sheet.anim-out .sheet{animation:none;}}

/* =========================================================
   菲律宾节庆风（Fiesta）— 只套用在活动相关画面与元件
   VOICE   热闹、亲切、在地；IDEA 镇上庆典的彩旗与市集摊位
   COLOUR  奶油底＋菲律宾国旗红/蓝/太阳黄＋芒果橘、椰叶绿
   TYPE    圆润粗体 Baloo 2（标题、数字）
   LAYOUT  白色圆角「摊位卡」＋厚实底影按钮，彩旗横跨主视觉
   ========================================================= */
.theme-fiesta{
  --f-cream:#fff6e0; --f-cream-2:#ffe9b8; --f-ink:#3b2410; --f-ink-2:#6b4a2a;
  --f-red:#e63946; --f-red-d:#a8202c; --f-blue:#1d5fd8; --f-blue-d:#123f96;
  --f-yellow:#ffc93c; --f-yellow-d:#d99a00; --f-green:#2bb673; --f-green-d:#178a52;
  --f-pink:#ff4f9a; --f-orange:#ff8a1f;
  --f-font:"Baloo 2","PingFang SC","Microsoft YaHei",Arial,sans-serif;
}
.theme-fiesta .phone{background:var(--f-cream);}
/* 浅底上把原本的金色／浅字变数改为深色，确保文字对比 */
.theme-fiesta .act,.theme-fiesta .sheet--dark,.theme-fiesta .hq__card,.theme-fiesta .nt,.theme-fiesta .mycard{--c-gold:var(--f-red);--c-text-2:var(--f-ink-2);--c-text-3:#8a6b4a;--c-orange:var(--f-orange);}
.theme-fiesta .act{background:
  radial-gradient(circle at 50% 120px, rgba(255,201,60,.45) 0 90px, transparent 91px),
  repeating-conic-gradient(from 0deg at 50% 120px, rgba(255,201,60,.16) 0 10deg, transparent 10deg 20deg),
  var(--f-cream);color:var(--f-ink);}
/* 彩旗 */
.bunting{display:none;}
.theme-fiesta .bunting{display:block;position:absolute;left:0;right:0;top:0;height:30px;
  background:
    linear-gradient(135deg,transparent 50%,var(--f-cream) 50%) 0 0/28px 26px,
    linear-gradient(225deg,transparent 50%,var(--f-cream) 50%) 0 0/28px 26px,
    repeating-linear-gradient(90deg,var(--f-red) 0 28px,var(--f-yellow) 28px 56px,var(--f-blue) 56px 84px,var(--f-green) 84px 112px,var(--f-pink) 112px 140px);
  -webkit-mask:linear-gradient(#000,#000);opacity:.95;}
.theme-fiesta .bunting::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--f-ink-2);}
.theme-fiesta .hero{padding-top:34px;}
.theme-fiesta .hero__gift{font-size:4.2rem;filter:drop-shadow(0 6px 0 rgba(59,36,16,.15));}
.theme-fiesta .hero__title{font-family:var(--f-font);font-weight:800;color:var(--f-red);text-shadow:0 3px 0 var(--f-yellow);font-size:1.35rem;letter-spacing:0;}
.theme-fiesta .hero__sub{color:var(--f-ink-2);font-weight:600;}
.theme-fiesta .hero__rules{background:var(--f-blue);color:#fff;top:38px;box-shadow:0 3px 0 var(--f-blue-d);font-family:var(--f-font);}
/* 资讯列 */
.theme-fiesta .info2__cell{background:#fff;border:2px solid var(--f-ink);box-shadow:0 3px 0 var(--f-ink);border-radius:14px;}
.theme-fiesta .info2__k{color:var(--f-ink-2);font-weight:600;}
.theme-fiesta .info2__v{color:var(--f-red);font-family:var(--f-font);}
/* 进度区块 */
.theme-fiesta .prog{background:#fff;border:2px solid var(--f-ink);box-shadow:0 4px 0 var(--f-ink);border-radius:16px;}
.theme-fiesta .prog__head{color:var(--f-ink-2);font-weight:600;}
.theme-fiesta .prog__amt{color:var(--f-ink);font-family:var(--f-font);}
.theme-fiesta .prog__amt small{color:var(--f-ink-2);}
.theme-fiesta .prog__track{background:#f1e3c4;border:2px solid var(--f-ink);height:14px;}
.theme-fiesta .prog__fill{background:repeating-linear-gradient(90deg,var(--f-red) 0 12px,var(--f-yellow) 12px 24px,var(--f-blue) 24px 36px,var(--f-green) 36px 48px);}
.theme-fiesta .ms__dot{background:#fff;border-color:var(--f-ink);color:var(--f-ink);}
.theme-fiesta .ms--hit .ms__dot{background:var(--f-green);color:#fff;}
.theme-fiesta .ms__top{color:var(--f-red);font-family:var(--f-font);}
.theme-fiesta .ms__bot{color:var(--f-ink-2);}
.theme-fiesta .prog__hint{color:var(--f-ink);font-weight:600;}
.theme-fiesta .prog__hint b{color:var(--f-red);}
.theme-fiesta .hlink__btn{color:var(--f-blue);font-weight:800;}
/* 档位卡（摊位卡） */
.theme-fiesta .tier{background:#fff;border:2px solid var(--f-ink);box-shadow:0 4px 0 var(--f-ink);border-radius:16px;color:var(--f-ink);}
.theme-fiesta .tiers li:nth-child(1) .tier__flag,.theme-fiesta .tier[data-tier="0"] .tier__flag{background:var(--f-blue);box-shadow:0 2px 0 var(--f-blue-d);}
.theme-fiesta .tier[data-tier="1"] .tier__flag{background:var(--f-green);box-shadow:0 2px 0 var(--f-green-d);}
.theme-fiesta .tier[data-tier="2"] .tier__flag{background:var(--f-pink);box-shadow:0 2px 0 #c2266d;}
.theme-fiesta .tier__flag{font-family:var(--f-font);border-radius:8px;}
.theme-fiesta .tier__flag::before{color:var(--f-yellow);}
.theme-fiesta .tier__name{color:var(--f-ink);font-weight:600;}
.theme-fiesta .tier__name em{color:var(--f-red);}
.theme-fiesta .tier__sub{color:var(--f-ink-2);}
.theme-fiesta .tier--claimable{border-color:var(--f-yellow-d);box-shadow:0 4px 0 var(--f-yellow-d),0 0 0 4px rgba(255,201,60,.5);}
/* 按钮 */
.theme-fiesta .btn{font-family:var(--f-font);border-radius:999px;}
.theme-fiesta .btn--deposit{background:var(--f-red);box-shadow:0 3px 0 var(--f-red-d);}
.theme-fiesta .btn--claim{background:var(--f-yellow);color:var(--f-ink);box-shadow:0 3px 0 var(--f-yellow-d);}
.theme-fiesta .act .btn--ghost{background:#fff;color:var(--f-ink);border:2px solid var(--f-ink);}
.theme-fiesta .act .chip--ok{background:#dff7ea;color:var(--f-green-d);}
.theme-fiesta .act .chip--proc{background:#fff0d6;color:#b35c00;}
.theme-fiesta .act .chip--lock{background:#efe6d3;color:var(--f-ink-2);}
.theme-fiesta .act .chip--exp{background:#efe6d3;color:#8a7a66;}
.theme-fiesta .done-box,.theme-fiesta .allclear{background:#fff;border:2px dashed var(--f-ink-2);color:var(--f-ink);}
.theme-fiesta .done-box summary{color:var(--f-ink);}
.theme-fiesta .done-box li{border-top-color:#e7d6b3;}

<body class="theme-fiesta">
<div class="layout">

  <!-- ================================================================
       左侧：评审控制面板（不是前台画面，只是方便切换情境与查看规格注记）
       ================================================================ -->
  <aside class="panel" aria-label="原型控制面板">
    <h1>新人30日存款赠金 · 前台原型</h1>
    <p class="panel__ver">v0.9 节庆风试作 · 2026-11-27 · 依据《20261124 新客活动BRD》</p>

    <h2>视觉风格</h2>
    <div class="panel__row"><label for="selTheme">活动页风格</label>
      <select id="selTheme">
        <option value="fiesta" selected>菲律宾节庆风（Fiesta）</option>
        <option value="classic">暗红礼盒（原版）</option>
      </select></div>

    <h2>画面（UI 编号）</h2>
    <div class="panel__nav" id="navScreens"></div>

    <h2>用户 / 资格状态</h2>
    <div class="panel__row"><label for="selElig">资格查询结果</label>
      <select id="selElig" data-ctl="elig">
        <option value="ok">配发有效</option>
        <option value="notLogin">未登录</option>
        <option value="notEligible">不在名单中</option>
        <option value="pendingAlloc">等待营运配发</option>
      </select></div>
    <div class="panel__row"><label for="selStage">个人30日阶段</label>
      <select id="selStage" data-ctl="stage">
        <option value="before">尚未首存（Day 0）</option>
        <option value="active" selected>进行中（Day 5）</option>
        <option value="ended">30日已结束</option>
      </select></div>
    <div class="panel__row"><label for="selLevel">活动等级</label>
      <select id="selLevel" data-ctl="level">
        <option>L1</option><option selected>L2</option><option>L3</option><option>L4</option>
      </select></div>
    <div class="panel__row"><label for="selTime">当日时段</label>
      <select id="selTime" data-ctl="time">
        <option value="open">00:00–23:50 统计开放</option>
        <option value="closed">23:50–00:00 统计关闭</option>
      </select></div>
    <div class="panel__row"><label for="selKyc">KYC</label>
      <select id="selKyc" data-ctl="kyc">
        <option value="yes">已验证</option>
        <option value="no">未验证</option>
        <option value="pending">审核中</option>
      </select></div>

    <h2>模拟结果</h2>
    <div class="panel__row"><label for="selPay">付款结果</label>
      <select id="selPay" data-ctl="pay">
        <option value="success">成功</option>
        <option value="pending">处理中／未知</option>
        <option value="failed">失败</option>
      </select></div>
    <div class="panel__row"><label for="selKycR">KYC 验证结果</label>
      <select id="selKycR" data-ctl="kycResult">
        <option value="success">验证成功</option>
        <option value="pending">提交后审核中</option>
        <option value="failed">验证失败</option>
      </select></div>
    <div class="panel__row"><label for="selClaim">领取结果</label>
      <select id="selClaim" data-ctl="claim">
        <option value="success">帐务确认成功</option>
        <option value="processing">帐务确认中</option>
        <option value="failed">领取失败</option>
      </select></div>

    <h2>情境预设（BRD 第五节）</h2>
    <div class="panel__presets">
      <button class="panel__btn" data-preset="reset">重置今日</button>
      <button class="panel__btn" data-preset="A">情况A：一次存 ₱600</button>
      <button class="panel__btn" data-preset="B1">情况B ①存 ₱60</button>
      <button class="panel__btn" data-preset="B2">情况B ②存 ₱70</button>
      <button class="panel__btn" data-preset="B3">情况B ③存 ₱470</button>
      <button class="panel__btn" data-preset="settle">帐务确认完成</button>
      <button class="panel__btn" data-preset="nextDay">进入次日 00:00</button>
    </div>
    <div class="panel__log" id="log" aria-live="polite"></div>

    <h2>本画面规格注记</h2>
    <div class="panel__notes" id="notes"></div>
  </aside>

  <!-- ================================================================
       右侧：手机画面（内容由下方 JavaScript 依状态渲染）
       ================================================================ -->
  <main class="stage">
    <div class="phone" id="phone" aria-live="polite"></div>
  </main>
</div>

<script>
/* =====================================================================
   新人30日存款赠金 · 前台原型 v0.2
   v0.2 依 PM 确认更新：
   ① 一笔存款满足多档即同时达成，可领取多档合计奖金
   ② 当日统计至 23:50；00:00 起算次日（23:50–00:00 的存款不计入任何一天）
   ③ 领取期限为当日（00:00 前），未领取即过期，次日只能领取次日奖励
   ④ 入口依 BRD PDF「入口展示需求」UI 01–12
   ===================================================================== */

/* ---------- 一、方案数据（示意）----------
   L2 采用 BRD 第四节示例：₱100 / ₱300 / ₱600 → ₱15 / ₱30 / ₱60（合计 ₱105）。
   其余等级为示意，实际以营运核定表为准。 */
var PLANS = {
  L1:[{th:50,  b:8 },{th:150, b:15 },{th:300, b:30 }],
  L2:[{th:100, b:15},{th:300, b:30 },{th:600, b:60 }],
  L3:[{th:300, b:40},{th:900, b:90 },{th:1800,b:180}],
  L4:[{th:1000,b:120},{th:3000,b:300},{th:6000,b:600}]
};
var DAY_TOTAL = 30;

/* ---------- 二、状态：整个画面都由这一份 state 决定 ----------
   今日每档 tierStatus：null 未达标 / claimable 可领取 / claiming 领取中 /
                        processing 帐务确认中 / credited 已入帐
   往日奖励 past：只会是 credited（已入帐）或 expired（当日未领 → 过期） */
var state = {
  screen:'landing',
  elig:'ok', stage:'active', level:'L2', time:'open', kyc:'yes', kycResult:'success',
  pay:'success', claim:'success',
  day:5, cum:0, tierStatus:[null,null,null],
  mainBal:1250, bonusBal:135, balFlash:false,
  depAmount:'', depSource:'landing', depError:'', depReturn:'landing', payTab:'qrph', payCh:null, paySub:null, coupon:null, couponTmp:null,
  overlay:null, lastResult:null, lastClaimAmt:0,
  kycDep:null,   /* KYC 前原本要做的存款：{amount, src}，验证成功后带回 */
  focusTier:null, focusClaim:false,
  histTab:'all', claimFrom:null, yrFrom:'landing', calSel:5,
  toast:null,
  past:[
    {day:4, tier:1, amt:15, status:'credited'},
    {day:4, tier:2, amt:30, status:'expired'},
    {day:2, tier:1, amt:15, status:'credited'},
    {day:2, tier:2, amt:30, status:'credited'},
    {day:2, tier:3, amt:60, status:'credited'},
    {day:1, tier:1, amt:15, status:'credited'}
  ]
};

function plan(){ return PLANS[state.level]; }
function peso(n){ return '₱' + Number(n).toLocaleString('en-US'); }
function maxTh(){ return plan()[2].th; }
function dayTotal(){ return plan().reduce(function(s,t){return s+t.b;},0); }
function nextTier(){ for(var i=0;i<3;i++){ if(state.cum < plan()[i].th) return i; } return -1; }

/* ---------- 三、核心规则：存款成功后核算所有「已达标且尚未产生奖励」的档位 ----------
   - 当日累计 ≥ 该档门槛 即达标；一笔存款可同时达成多档，合计奖金一起可领
   - 每档每日最多一次；是否已领取不影响更高档判断
   - 超过最高门槛不产生第四档、不结转次日 */
function applyDeposit(amount){
  var before = state.cum, newly = [];
  state.cum += amount;
  plan().forEach(function(t,i){
    if(state.cum >= t.th && state.tierStatus[i] === null){ state.tierStatus[i] = 'claimable'; newly.push(i); }
  });
  if(state.stage === 'before'){ state.stage = 'active'; state.day = 1; syncSelects(); }
  log('存款 '+peso(amount)+'：累计 '+peso(before)+' → '+peso(state.cum)+
      (newly.length ? '；新增达标 第'+newly.map(function(i){return i+1;}).join('、')+'档，合计 +'+peso(sumTiers(newly)) : '；无新增档位'));
  return newly;
}
function sumTiers(arr){ return arr.reduce(function(s,i){return s+plan()[i].b;},0); }
function simulate(amount){
  var after = state.cum + amount, unlock = [];
  plan().forEach(function(t,i){ if(after >= t.th && state.cum < t.th) unlock.push(i); });
  return {after:after, unlock:unlock};
}
function claimableIdx(){ var a=[]; state.tierStatus.forEach(function(s,i){ if(s==='claimable') a.push(i); }); return a; }
function claimableSum(){ return sumTiers(claimableIdx()); }
function creditedTotal(){
  var s = state.past.filter(function(p){return p.status==='credited';}).reduce(function(x,p){return x+p.amt;},0);
  state.tierStatus.forEach(function(st,i){ if(st==='credited') s+=plan()[i].b; });
  return s;
}
/* 入口是否渲染：名单内且资格查询有结果，且个人30日未结束 */
function visible(){ return (state.elig==='ok' || state.elig==='pendingAlloc'); }
function participating(){ return state.elig==='ok' && state.stage==='active'; }

/* ---------- 四、画面清单（左侧导航）---------- */
var SCREENS = [
  {id:'home',        ui:'01', name:'Home 新人入口'},
  {id:'popup',       ui:'02', name:'Home 专属 Popup'},
  {id:'rewards',     ui:'03', name:'Rewards 参与者 Banner'},
  {id:'landing',     ui:'04/06', name:'Landing 配发／当前任务'},
  {id:'deposit',     ui:'07', name:'Deposit 充值页'},
  {id:'result',      ui:'08', name:'Deposit 结果'},
  {id:'kyc',         ui:'09', name:'KYC 充值前分支'},
  {id:'my',          ui:'10', name:'MY 可领卡'},
  {id:'yourRewards', ui:'11', name:'Your Rewards'},
  {id:'history',     ui:'12', name:'History（弹窗）'}
];

function render(){
  var s = state.screen, h;
  if(s==='home') h = viewHome();
  else if(s==='deposit') h = viewDeposit();
  else if(s==='rewards') h = viewRewards();
  else if(s==='my') h = viewMy();
  else if(s==='yourRewards') h = viewYourRewards();
  else h = viewLanding();
  h += viewOverlay();
  if(state.toast) h += '<div class="toast'+(state.toast.err?' toast--err':'')+'" role="status">'+state.toast.msg+'</div>';
  /* 保留捲动位置：同一画面重新绘制时（开弹窗、领取、切分页等），页面与弹窗清单不跳回顶部 */
  var phone = document.getElementById('phone');
  var oldPage = phone.querySelector('.phone__scroll'), oldList = phone.querySelector('.sheet__scroll');
  var samePage = state._shownScreen === state.screen, sameSheet = state._shownOverlay === state.overlay;
  var pageTop = (oldPage && samePage) ? oldPage.scrollTop : 0, listTop = (oldList && sameSheet) ? oldList.scrollTop : 0;
  phone.innerHTML = h;
  var newPage = phone.querySelector('.phone__scroll'), newList = phone.querySelector('.sheet__scroll');
  if(newPage) newPage.scrollTop = pageTop;
  if(newList) newList.scrollTop = listTop;
  /* 底部弹窗刚打开时：由下向上展开（只在打开当下播放一次） */
  var sheetMask = phone.querySelector('.mask--sheet');
  if(sheetMask && !sameSheet && state._shownOverlay!=='claimOk') sheetMask.classList.add('anim-in');   /* 从领取成功弹窗返回 History 时不重播 */
  state._shownScreen = state.screen; state._shownOverlay = state.overlay;
  renderNav(); renderNotes(); tick(); setupHomeCarousel();
  var target = state.focusTier!==null ? document.querySelector('[data-tier="'+state.focusTier+'"]') :
               state.focusClaim ? document.getElementById('claimList') : null;
  if(target){ target.scrollIntoView({block:'center'}); target.classList.add('tier--focus'); }
  state.focusTier = null; state.focusClaim = false; state.balFlash = false;
}

/* ---------- 共用元件 ---------- */
function tabbar(on){
  var cnt = participating() ? claimableIdx().length : 0;
  var items = [['rewards','🎁','Rewards'],['mall','🏪','Points Mall'],['tourney','🏆','Tourney'],['my','👤','My']];
  var home = '<button class="tabbar__item tabbar__home'+(on==='home'?' tabbar__item--on':'')+'" data-go="home" aria-label="Home"><span class="tabbar__logo" aria-hidden="true">🏠</span>Home</button>';
  return '<nav class="tabbar" aria-label="底部导航">'+home+items.map(function(it){
    var badge = (it[0]==='my' && cnt) ? '<span class="dot-badge">'+cnt+'</span>' : (it[0]==='tourney' ? '<span class="dot-red" aria-label="有新活动"></span>' : '');
    return '<button class="tabbar__item'+(on===it[0]?' tabbar__item--on':'')+'" data-go="'+it[0]+'"><span class="tabbar__ic" aria-hidden="true">'+it[1]+'</span>'+it[2]+badge+'</button>';
  }).join('')+'</nav>';
}
function appbar(title, back){
  return '<header class="appbar">'+(back?'<button class="appbar__back" data-go="'+back+'" aria-label="返回">‹</button>':'')+'<h1 class="appbar__title"'+(back?'':' style="padding-right:0"')+'>'+title+'</h1></header>';
}
function stateBox(ic,t,d,btn){ return '<section class="state"><div class="state__ic" aria-hidden="true">'+ic+'</div><p class="state__t">'+t+'</p><p class="state__d">'+d+'</p>'+btn+'</section>'; }
function hiddenAnno(where){
  return '';   /* 画面内不显示规格标注（说明改记于左侧规格注记） */
  var why = state.stage==='ended' && state.elig==='ok' ? '个人30日已结束，入口隐藏【待确认】' :
    state.elig==='notEligible' ? '非名单用户不可见此活动' :
    state.elig==='notLogin' ? '未登录无法判断名单，入口不展示' :
    state.elig==='loading' ? '资格查询中，不预留占位，返回后再插入' : '资格查询失败，入口不展示；落地页提供重试';
  return '';
}
function expireHint(){
  if(!claimableIdx().length) return '';
  return '<div class="expire" role="note">Claim today\'s rewards before 00:00 — unclaimed rewards expire in <b data-cd="midnight">--:--:--</b></div>';
}
function statusChip(st){
  if(st==='claiming') return '<span class="chip chip--proc">Claiming…</span>';
  if(st==='processing') return '<span class="chip chip--proc">Processing</span>';
  if(st==='credited') return '<span class="chip chip--ok">Credited</span>';
  if(st==='expired') return '<span class="chip chip--exp">Expired</span>';
  return '';
}

/* ---------- UI 01 Home 新人入口 ----------
   View Offer → 04；已有当前任务 → 定位 06；可领状态 → 原位 Claim */
/* 首页版面参考 okbet.com 手机版一般首页结构：浮动用户列 → Banner 轮播（满版图片位 750×360，美术提供）→ 白色内容卡（游戏橱窗、分类、各游戏区块）→ 底部导航。
   不放任何品牌名称／Logo；游戏名称与图片皆为示意，未沿用参考站素材。 */
var GAMES = [
  {n:'Fiesta Spin', e:'💃', p:'Studio A', g:'#ff8a3d,#ff3d77'},
  {n:'Lucky Carabao', e:'🐃', p:'Studio B', g:'#36c46b,#0f7a4a'},
  {n:'Mango Rush', e:'🥭', p:'Studio C', g:'#ffd23f,#ff8f1f'},
  {n:'Jeepney Jackpot', e:'🚌', p:'Studio A', g:'#5b8cff,#7a3dff'},
  {n:'Island Gems', e:'💎', p:'Studio D', g:'#2fd5e8,#2368ff'},
  {n:'Tala Wins', e:'⭐', p:'Studio B', g:'#9b5bff,#ff5bd8'},
  {n:'Golden Rooster', e:'🐓', p:'Studio E', g:'#ff5b4a,#a8122a'},
  {n:'Neon Fortune', e:'🔮', p:'Studio C', g:'#3d2bff,#00d0ff'},
  {n:'Sunset Reels', e:'🌅', p:'Studio D', g:'#ff9a5b,#c2185b'}

/* 首页任务卡：滑到目标卡，并让圆点跟着滑动更新 */
function setupHomeCarousel(){
  var tr = document.getElementById('hqTrack'); if(!tr) return;
  var ci = claimableIdx(), target = ci.length ? ci[0] : (nextTier()===-1 ? 2 : nextTier());
  var card = tr.querySelector('[data-hq="'+target+'"]');
  if(card) tr.scrollLeft = card.offsetLeft - tr.offsetLeft - 12;
  var sync = function(){
    var w = tr.firstElementChild.offsetWidth + 8, idx = Math.round(tr.scrollLeft / w);
    idx = Math.max(0, Math.min(2, idx));
    if(tr.scrollLeft + tr.clientWidth >= tr.scrollWidth - 4) idx = 2;
    document.querySelectorAll('[data-hqdot]').forEach(function(d){ d.classList.toggle('on', +d.dataset.hqdot===idx); });
  };
  tr.addEventListener('scroll', sync, {passive:true}); sync();
}

/* 日期换算：首存日 2026/11/20 ＝ Day 1（示意；Day 5 即 2026/11/24 今日） */
var START = Date.UTC(2026,10,20);
var WEEK = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dateObj(day){ return new Date(START + (day - 1) * 86400000); }
function dateOf(day){ var t = dateObj(day); return t.getUTCFullYear()+'/'+String(t.getUTCMonth()+1).padStart(2,'0')+'/'+String(t.getUTCDate()).padStart(2,'0'); }
function shortDate(day){ var t = dateObj(day); return (t.getUTCMonth()+1)+'/'+t.getUTCDate(); }

function calendar(){
  var recs = allRecords(), active = state.stage==='active';
  var h = '<div class="cal" role="group" aria-label="30日日历：仅今日可点击查看当日奖励">';
  for(var d=1; d<=DAY_TOTAL; d++){
    var got = recs.filter(function(r){return r.day===d && (r.status==='credited' || r.status==='processing');}).length;
    var pips=''; for(var k=0;k<3;k++) pips += '<i class="'+(k<got?'on':'')+'"></i>';
    var today = active && d===state.day, future = active && d>state.day, sel = active && d===state.calSel;
    var cls = 'cal__d' + (today?' cal__d--today':'') + (future?' cal__d--future':'') + (!today && !future?' cal__d--past':'') + (sel?' cal__d--sel':'');
    var inner = (today?'<span class="cal__tag">TODAY</span>':'')+'<b>'+d+'</b><span class="cal__date">'+shortDate(d)+'</span><span class="cal__pips">'+pips+'</span>';
    if(today){
      h += '<button class="'+cls+'" data-cal="'+d+'" aria-pressed="'+sel+'" aria-label="Day '+d+'，'+dateOf(d)+(today?'，今日':'')+'，查看当日奖励">'+inner+'</button>';
    } else {
      h += '<div class="'+cls+'" aria-label="Day '+d+'，'+dateOf(d)+(future?'，尚未开始':'，已过，已领取 '+got+' 档')+'">'+inner+'</div>';
    }
  }
  return h + '</div><p class="legend">● = 当日已领取档位数（未领过期不计）· 仅「今日」可点击查看当日奖励；其他日期不可点击</p>';
}
/* 点击日期后显示的「当日奖励」区块 */
function dayDetail(d){
  var p = plan(), isToday = d===state.day;
  var h = '<section class="dd'+(isToday?' dd--today':'')+'"'+(isToday?' id="claimList"':'')+' aria-live="polite" aria-label="Day '+d+' 奖励">';
  h += '<div class="dd__h"><span class="dd__t">'+(isToday?'Today · ':'')+'Day '+d+'</span><span class="dd__date">'+dateOf(d)+' ('+WEEK[dateObj(d).getUTCDay()]+')</span></div>';
  if(isToday){
    h += '<p class="dd__sum">Today '+peso(state.cum)+' / '+peso(maxTh())+' · Up to <b>'+peso(dayTotal())+'</b></p><ul class="mini mini--flat">'+p.map(function(t,i){
      var st = state.tierStatus[i], right;
      if(st==='claimable') right = '<button class="btn btn--claim btn--sm" data-claim="'+i+'" data-from="yourRewards">Claim</button>';
      else if(st) right = statusChip(st);
      else if(state.time==='closed') right = '<span class="chip chip--lock">Closed</span>';
      else right = '<button class="btn btn--deposit btn--sm" data-dep="'+(t.th-state.cum)+'">Deposit</button>';
      return '<li class="mini__i"><div>Tier '+(i+1)+' · Deposit '+peso(t.th)+' → <b class="nw" style="color:var(--c-gold)">+'+peso(t.b)+'</b><small>'+peso(Math.min(state.cum,t.th))+' / '+peso(t.th)+'</small></div>'+right+'</li>';
    }).join('')+'</ul>';
    var ci = claimableIdx();
    if(ci.length) h += '<p class="dd__exp">Claim before 00:00 — unclaimed rewards expire in <b data-cd="midnight">--:--:--</b></p>';
    if(ci.length>1) h += '<button class="btn btn--claim btn--block" style="margin-top:8px" data-act="claimAll" data-src="yourRewards">Claim total '+peso(claimableSum())+' ('+ci.length+' tiers)</button>';
  } else {
    var gap = d - state.day;
    h += '<p class="dd__sum">Opens in '+gap+' day'+(gap>1?'s':'')+' · Up to <b>'+peso(dayTotal())+'</b></p><ul class="mini mini--flat">'+p.map(function(t,i){
      return '<li class="mini__i"><div>Tier '+(i+1)+' · Deposit '+peso(t.th)+'<small>Daily total on '+shortDate(d)+'</small></div><b class="nw" style="color:var(--c-gold)">+'+peso(t.b)+'</b></li>';
    }).join('')+'</ul>';
  }
  return h + '</section>';
}
function allRecords(){
  var today = [];
  state.tierStatus.forEach(function(st,i){ if(st) today.push({day:state.day, tier:i+1, amt:plan()[i].b, status:st, idx:i}); });
  return today.concat(state.past);
}

var CHANNELS = {

         (state.depError?'<p class="err" role="alert">'+state.depError+'</p>':'')+'</section>';
  } else if(state.payTab!=='redeem'){
    h += '<p class="dep__hint">'+(ch ? 'Select a payment bank to enter the amount.' : 'Select a payment channel to continue.')+(state.depAmount?' (Amount ₱'+state.depAmount+' kept)':'')+'</p>';
  }

/* Promotions：新人活动（自动参加，不需勾选）＋ 存送券（勾选其一，View More Offers 弹窗） */
function depPromotions(){

/* 新人活动：每个奖励一张独立小卡，可左右滑动
   - 小卡只提示「充值多少可获得多少奖励」：Deposit ₱X（距离该档还差的金额）→ Get ₱Y
   - 输入金额后即时标示本次可达成的小卡；已达标未领显示 To claim；已领取的小卡变淡并排到最后
   - 点未达标小卡：把所需金额带入输入框（低于渠道最低金额时以最低金额带入） */
function depNewcomer(){
  if(state.elig!=='ok' || state.stage==='ended') return '';
  var p = plan(), amt = parseInt(state.depAmount,10) || 0, closed = state.time==='closed';
  var order = [0,1,2].sort(function(x,y){
    var dx = (state.tierStatus[x]==='credited'||state.tierStatus[x]==='processing') ? 1 : 0;
    var dy = (state.tierStatus[y]==='credited'||state.tierStatus[y]==='processing') ? 1 : 0;
    return dx - dy || x - y;
  });
  var cards = order.map(function(i){
    var t = p[i], st = state.tierStatus[i], gap = t.th - state.cum, cls = '', main, sub, attr = '';
    if(st==='credited' || st==='processing'){ cls=' nt--done'; main='Claimed'; sub='Reward claimed today'; }
    else if(st==='claimable' || st==='claiming'){ cls=' nt--claim'; main='Reached'; sub='Claim before 00:00'; }
    else if(closed){ cls=' nt--lock'; main='Closed'; sub='Count closed at 23:50'; }
    else {
      main = 'Deposit '+peso(gap);
      sub = (amt>0 && amt>=gap) ? '✓ This deposit' : 'Tap to fill';
      if(amt>0 && amt>=gap) cls=' nt--hit';
      attr = ' data-amt="'+Math.max(gap, DEP_MIN)+'"';
    }
    return '<li><button class="nt'+cls+'"'+attr+(attr?'':' tabindex="-1" aria-disabled="true"')+' aria-label="'+(st?main:'Deposit '+peso(gap)+' to get '+peso(t.b))+'">'+
      '<span class="nt__bonus">+'+peso(t.b)+'</span><span class="nt__main">'+main+'</span><span class="nt__sub">'+sub+'</span></button></li>';
  }).join('');
  return '<section class="dep__sec"><div class="dep__ph"><h2 class="dep__h" style="margin:0">Newcomer Bonus</h2><button class="dep__more" data-act="ncMore">More ›</button></div>'+
    '<ul class="ncw__track" aria-label="新人活动奖励">'+cards+'</ul></section>';
}

function offersSheet(){

  return '<div class="mask" role="dialog" aria-modal="true"><div class="dlg"><div class="dlg__ic" aria-hidden="true">❌</div><p class="dlg__t">Payment failed</p><p class="dlg__d">No money was taken. Your progress is unchanged.</p><div class="dlg__btns"><button class="btn btn--deposit btn--block" data-act="retryPay">Try Again</button><button class="btn btn--ghost btn--block" style="color:#5a4a4a;background:#f3eded" data-close>Back to promo</button></div></div></div>';

/* ---------- 五、领取流程（Home／Landing／MY／Your Rewards／History 共用）----------
   传入今日档位索引阵列；同一档只会入帐一次（非 claimable 一律略过＝防重复点击） */
/* 关闭浮层：底部弹窗（History／Rules）先播放由上向下收起动画，结束后再移除 */
function closeOverlay(after){
  var m = document.querySelector('#phone .mask--sheet');
  var done = function(){ state.overlay = null; if(after) after(); render(); };
  if(!m) return done();
  if(m.classList.contains('anim-out')) return;
  m.classList.remove('anim-in'); m.classList.add('anim-out');
  setTimeout(done, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 240);
}
function claim(idxs, from){
  state.claimFrom = from || null;
  idxs = idxs.filter(function(i){ return state.tierStatus[i]==='claimable'; });
  if(!idxs.length) return;
  idxs.forEach(function(i){ state.tierStatus[i]='claiming'; });
  render();
  setTimeout(function(){
    var sum = sumTiers(idxs);
    if(state.claim==='success'){
      idxs.forEach(function(i){ state.tierStatus[i]='credited'; });
      state.bonusBal += sum; state.balFlash = true; state.lastClaimAmt = sum; state.overlay='claimOk';
      log('领取 第'+idxs.map(function(i){return i+1;}).join('、')+'档 → 帐务确认成功 +'+peso(sum)+'，Bonus 余额 '+peso(state.bonusBal));
    } else if(state.claim==='processing'){
      idxs.forEach(function(i){ state.tierStatus[i]='processing'; });
      toast('Claim submitted. Bonus is being credited.');
      log('领取 第'+idxs.map(function(i){return i+1;}).join('、')+'档 → 帐务确认中');
    } else {
      idxs.forEach(function(i){ state.tierStatus[i]='claimable'; });
      toast('Claim failed. Please try again.', true);
      log('领取失败，恢复可领取');
    }
    render();
  }, 700);
}

/* ---------- 六、存款流程 ---------- */
function openDeposit(amount, src){
  /* 平台规则：未完成 KYC 不可充值 → 任何充值入口都先引导验证，并记住原本要存的金额与来源 */
  if(state.kyc!=='yes'){
    state.kycDep = {amount:amount, src:src || state.screen};
    state.overlay = state.kyc==='pending' ? 'kycPending' : 'kyc';
    log('点击充值（'+(src||state.screen)+'）→ 未完成 KYC，先引导验证');
    return render();
  }
  if(amount) state.depAmount = String(Math.max(amount, DEP_MIN));
  if(state.screen!=='deposit') state.depReturn = state.screen;
  state.depSource = src || state.screen; state.depError=''; state.overlay=null; state.screen='deposit';
  render();
}
function pay(){
  if(!amountReady()) return toast('Please select a payment channel first.', true);
  var raw = state.depAmount.trim(), amt = parseInt(raw,10);
  if(!raw){ state.depError='Please enter an amount.'; return render(); }
  if(!(amt>0) || String(amt)!==raw){ state.depError='Please enter a whole number.'; return render(); }
  if(amt<DEP_MIN || amt>DEP_MAX){ state.depError='Please enter an amount between ₱'+DEP_MIN+' and ₱'+DEP_MAX.toLocaleString('en-US')+'.'; return render(); }
  var newly = [], uncounted = false;
  if(state.pay==='success'){
    if(state.time==='closed'){ uncounted = true; log('存款 '+peso(amt)+' 成功（23:50 后），不计入任何一天'); }
    else if(state.elig!=='ok' || state.stage==='ended'){ log('存款 '+peso(amt)+' 成功，一般存款不计入活动'); }
    else newly = applyDeposit(amt);
    state.mainBal += amt;
  } else log('存款 '+peso(amt)+' → '+(state.pay==='pending'?'处理中，不计入进度':'失败，不计入进度'));
  state.lastResult = {type:state.pay, amt:amt, newly:newly, uncounted:uncounted};
  state.overlay = 'result';
  if(state.pay==='success') state.depAmount='';
  render();
}

/* ---------- 七、跨日（00:00）：今日未领 → 过期；进度归零 ---------- */
function nextDay(){
  var expired = 0;
  state.tierStatus.forEach(function(st,i){
    if(!st) return;
    var rec = {day:state.day, tier:i+1, amt:plan()[i].b, status: st==='credited'||st==='processing' ? st : 'expired'};
    if(rec.status==='expired') expired += rec.amt;
    state.past.unshift(rec);
  });
  log('—— 进入 Day '+(state.day+1)+' 00:00 ——'+(expired?' Day '+state.day+' 未领 '+peso(expired)+' 已过期':''));
  state.cum=0; state.tierStatus=[null,null,null]; state.time='open'; state.overlay=null;
  if(state.day>=DAY_TOTAL){ state.stage='ended'; } else state.day++;
  state.calSel = state.day;
  syncSelects();
}

/* =====================================================================
   八、事件（集中以事件委派处理）
   ===================================================================== */
var phone = document.getElementById('phone');
phone.addEventListener('click', function(e){
  /* 点遮罩关闭底部弹窗（History／Rules／存款抽屉） */
  if(e.target.classList.contains('mask--sheet')) return closeOverlay();
  var t = e.target.closest('button'); if(!t) return;
  if(t.hasAttribute('data-close')){
    if(t.closest('.mask--sheet')) return closeOverlay();
    if(state.overlay==='result' && state.screen==='deposit' && state.lastResult && state.lastResult.type!=='failed') state.screen = state.depReturn || 'landing';
    state.overlay = (state.overlay==='claimOk' && state.claimFrom==='history') ? 'history' : null; state.claimFrom=null; return render();
  }
  if(t.dataset.go){
    if(t.dataset.go==='dep') return openDeposit(null,'home-header');
    if(t.dataset.go==='mall'||t.dataset.go==='tourney') return toast('示意：非本次需求范围');
    state.overlay=null; state.screen=t.dataset.go;
    if(t.dataset.focus) state.focusTier=+t.dataset.focus;
    return render();
  }
  if(t.dataset.ov){ state.overlay=t.dataset.ov; return render(); }
  /* 档位 Deposit 按钮（活动详情页、首页任务卡、Your Rewards、How to join）：进入充值页时不预设金额，金额栏清空 */
  if(t.dataset.dep){ state.depAmount=''; state.depError=''; return openDeposit(null, state.screen); }
  if(t.dataset.amt){ state.depAmount=t.dataset.amt; state.depError=''; return render(); }
  if(t.dataset.add){ state.depAmount=String((parseInt(state.depAmount,10)||0)+(+t.dataset.add)); state.depError=''; return render(); }
  if(t.dataset.paytab){ state.payTab=t.dataset.paytab; state.payCh=null; state.paySub=null; state.depError=''; return render(); }
  if(t.dataset.rwcat){ state.rwCat=t.dataset.rwcat; return render(); }
  if(t.dataset.paych){ state.payCh=t.dataset.paych; state.paySub=null; return render(); }
  if(t.dataset.paysub){ state.paySub=t.dataset.paysub; return render(); }
  if(t.dataset.coupon){ state.coupon = state.coupon===t.dataset.coupon ? null : t.dataset.coupon; return render(); }
  if(t.dataset.pick){ state.couponTmp=t.dataset.pick; return render(); }
  if(t.dataset.claim!==undefined) return claim([+t.dataset.claim], t.dataset.from);
  if(t.dataset.tab){ state.histTab=t.dataset.tab; return render(); }
  if(t.dataset.cal){ state.calSel=+t.dataset.cal; return render(); }
  var a = t.dataset.act;
  if(a==='pay') return pay();
  if(a==='claimAll') return claim(claimableIdx(), t.dataset.src);
  if(a==='toYR'){ state.yrFrom=t.dataset.from||'landing'; state.screen='yourRewards'; state.focusClaim = t.dataset.from==='rewards'; if(state.focusClaim) state.calSel = state.day; return render(); }
  if(a==='toHist'){ state.histTab='all'; state.overlay='history'; return render(); }
  if(a==='viewRewards'){ state.overlay=null; state.screen='landing'; var c=state.tierStatus.indexOf('claimable'); if(c>-1) state.focusTier=c; return render(); }
  if(a==='checkStatus') return toast('Still processing. We\'ll update your progress once confirmed.');
  if(a==='retryPay'){ state.depAmount=String(state.lastResult.amt); state.overlay=null; state.screen='deposit'; return render(); }
  if(a==='depBack'){ state.screen = state.depReturn || 'landing'; return render(); }
  if(a==='soon') return toast('示意：非本次需求范围');
  if(a==='ncMore'){ state.screen='landing'; return render(); }
  if(a==='moreOffers'){ state.couponTmp = state.coupon || 'none'; state.overlay='offers'; return render(); }
  if(a==='offersOk'){ state.coupon = state.couponTmp==='none' ? null : state.couponTmp; state.overlay=null; return render(); }
  if(a==='kycStart'){ state.kycDep={amount:null, src:state.screen}; state.overlay = state.kyc==='pending' ? 'kycPending' : 'kyc'; return render(); }
  if(a==='verify'){
    if(state.kycResult==='success'){ state.kyc='yes'; state.overlay='kycDone'; log('KYC 验证成功 → 可充值'); }
    else if(state.kycResult==='pending'){ state.kyc='pending'; state.overlay='kycPending'; log('KYC 已提交，审核中 → 暂不可充值'); }
    else { state.overlay='kycFail'; log('KYC 验证失败'); }
    syncSelects(); return render();
  }
  if(a==='kycContinue'){ var dep = state.kycDep || {}; state.kycDep = null; state.overlay=null; return openDeposit(dep.amount, dep.src); }
  if(a==='login'){ state.elig='ok'; syncSelects(); return render(); }
  if(a==='retry'){ state.elig='loading'; syncSelects(); render(); setTimeout(function(){ state.elig='ok'; syncSelects(); render(); },900); }
});
phone.addEventListener('input', function(e){
  if(e.target.id!=='depInput') return;
  state.depAmount = e.target.value.replace(/[^\d]/g,''); state.depError='';
  var pos = state.depAmount.length; render();
  var el = document.getElementById('depInput'); el.focus(); el.setSelectionRange(pos,pos);
});

/* 控制面板 */
document.querySelectorAll('[data-ctl]').forEach(function(sel){
  sel.addEventListener('change', function(){
    var k = sel.dataset.ctl; state[k] = sel.value;
    if(k==='level'){ resetToday(); log('切换示意用户等级 '+sel.value+'（今日进度重置；实际等级变动生效时间【待确认】）'); }
    if(k==='stage'){ resetToday(); if(sel.value==='active') state.day=5; state.kyc = sel.value==='before' ? 'no' : 'yes'; syncSelects(); }
    render();
  });
});
function resetToday(){ state.cum=0; state.tierStatus=[null,null,null]; state.overlay=null; }
function syncSelects(){ ['elig','stage','level','time','kyc','kycResult','pay','claim'].forEach(function(k){ var s=document.querySelector('[data-ctl="'+k+'"]'); if(s) s.value=state[k]; }); }
document.querySelector('.panel__presets').addEventListener('click', function(e){
  var b = e.target.closest('[data-preset]'); if(!b) return;
  var k = b.dataset.preset;
  function prep(){ state.kyc='yes'; state.level='L2'; state.elig='ok'; state.time='open'; state.pay='success'; if(state.stage!=='active'){ state.stage='active'; state.day=5; } syncSelects(); state.screen='landing'; }
  if(k==='reset'){ resetToday(); log('—— 重置今日 ——'); }
  if(k==='A'){ prep(); resetToday(); var n=applyDeposit(600); state.lastResult={type:'success',amt:600,newly:n}; state.overlay='result'; }
  if(k==='B1'||k==='B2'||k==='B3'){
    prep(); if(k==='B1') resetToday();
    var v = {B1:60,B2:70,B3:470}[k], nn = applyDeposit(v);
    state.lastResult={type:'success',amt:v,newly:nn}; state.overlay='result';
  }
  if(k==='settle'){
    state.tierStatus = state.tierStatus.map(function(s,i){ if(s==='processing'){ state.bonusBal+=plan()[i].b; return 'credited'; } return s; });
    state.past.forEach(function(p){ if(p.status==='processing'){ p.status='credited'; state.bonusBal+=p.amt; } });
    log('帐务确认完成：处理中 → 已入帐');
  }
  if(k==='nextDay') nextDay();
  render();
});
function currentKey(){
  var o = state.overlay;
  if(o==='result') return 'result';
  if(o && o.indexOf('kyc')===0) return 'kyc';
  if(o==='popup') return 'popup';
  if(o==='history') return 'history';
  return state.screen;
}
function renderNav(){
  var cur = currentKey();
  document.getElementById('navScreens').innerHTML = SCREENS.map(function(s){
    return '<button class="panel__btn'+(cur===s.id?' panel__btn--on':'')+'" data-screen="'+s.id+'">'+s.ui+' '+s.name+'</button>';
  }).join('');
}
document.getElementById('navScreens').addEventListener('click', function(e){
  var b = e.target.closest('[data-screen]'); if(!b) return;
  var id = b.dataset.screen; state.overlay=null;
  if(id==='popup'){ state.screen='home'; if(visible() && state.stage!=='ended') state.overlay='popup'; else toast('此状态不弹出 Popup（非名单／已结束）'); }
  else if(id==='deposit') return openDeposit(null,'landing');
  else if(id==='result'){
    /* 08 充值结果：在充值页实际执行一笔 ₱100 充值（QRPh），结果弹窗显示在充值页上，数字与进度一致；付款结果依左侧「付款结果」设定 */
    if(state.kyc!=='yes') return openDeposit(null,'panel');
    if(state.screen!=='deposit') state.depReturn = state.screen;
    state.screen='deposit'; state.payTab='qrph'; state.payCh='QRPh'; state.paySub=null; state.depAmount='100'; state.depError='';
    return pay();
  }
  else if(id==='kyc'){ state.screen='landing'; state.kyc='no'; syncSelects(); state.kycDep={amount:nextTier()>-1?plan()[nextTier()].th-state.cum:null, src:'landing-tier'}; state.overlay='kyc'; }
  else if(id==='yourRewards'){ state.yrFrom='landing'; state.screen=id; }
  else if(id==='history'){ if(state.screen==='home'||state.screen==='rewards') state.screen='yourRewards'; state.histTab='all'; state.overlay='history'; }
  else state.screen = id;
  render();
});

/* ---------- 十、小工具：倒计时（菲律宾时间 UTC+8）、Toast、日志 ---------- */
function tick(){
  var now = new Date(Date.now() + 8*3600*1000);
  var secs = now.getUTCHours()*3600 + now.getUTCMinutes()*60 + now.getUTCSeconds();
  var toMid = 86400 - secs, toCut = Math.max(0, 23*3600 + 50*60 - secs);
  document.querySelectorAll('[data-cd]').forEach(function(el){
    var s = el.dataset.cd==='midnight' ? toMid : toCut;
    el.textContent = [Math.floor(s/3600), Math.floor(s%3600/60), s%60].map(function(n){return String(n).padStart(2,'0');}).join(':');
  });
}
setInterval(tick, 1000);
function toast(msg, err){ state.toast={msg:msg, err:!!err}; render(); clearTimeout(toast._t); toast._t=setTimeout(function(){ state.toast=null; render(); }, 2200); }
function log(msg){ var el=document.getElementById('log'); el.textContent = msg + '\n' + el.textContent; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && state.overlay){ if(document.querySelector('#phone .mask--sheet')) closeOverlay(); else { state.overlay=null; render(); } } });

render();
</script>
